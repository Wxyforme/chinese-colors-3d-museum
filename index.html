<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传统古色 · 3D 博物馆与色谱长卷 [b31-local]</title>
<style>
  /* ============================================================
     共享：变量 / 复位 / 字体
     ============================================================ */
  :root {
    --desk: #14120e;          /* 桌面深底（两个视图共用的暗色底） */
    --paper: #e8ddc3;         /* 卷轴纸张底色 */
    --ink: #3a3323;           /* 纸上墨字 */
    --ink-soft: #7c735c;
    --segw: 88vw;             /* 卷轴单段宽 = 画心宽 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    background: var(--desk);
    color: #efe7d3;
  }
  .serif { font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif; }
  .mono { font-family: "SF Mono", "JetBrains Mono", "Consolas", "Menlo", monospace; }

  /* 两个顶层视图容器：靠显隐切换，互不干扰 */
  .view { position: fixed; inset: 0; }
  .view.hidden { display: none; }

  /* ============================================================
     视图 A · 3D 博物馆
     注意：容器上不可加 transform/filter/backdrop-filter，
     否则会成为 position:fixed 子元素的包含块，画布与顶栏会错位。
     ============================================================ */
  #view-museum { color: #efe7d3; }

  #c3d { position: fixed; inset: 0; display: block; }

  #view-museum header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: linear-gradient(180deg, rgba(20,18,14,0.85), rgba(20,18,14,0));
    pointer-events: none;
  }
  #view-museum header .brand { pointer-events: auto; }
  #view-museum header .cn { font-size: 18px; font-weight: 700; letter-spacing: 0.14em; }
  #view-museum header .en { font-size: 9px; letter-spacing: 0.26em; color: rgba(239,231,211,0.5); text-transform: uppercase; }
  #view-museum .dots { display: flex; gap: 8px; pointer-events: auto; }
  #view-museum .dot {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(239,231,211,0.25); transition: transform 0.2s ease;
  }
  #view-museum .dot.on { transform: scale(1.3); border-color: #efe7d3; }

  #view-museum .hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 20;
    font-size: 12px; letter-spacing: 0.14em; color: rgba(239,231,211,0.75);
    background: rgba(20,18,14,0.6); padding: 10px 18px; border-radius: 20px;
    border: 1px solid rgba(239,231,211,0.2); pointer-events: none;
    transition: opacity 0.4s ease;
  }

  /* 「左键点下去会怎样」的提示（JS 里 setAim() 驱动）。
     容器本身是一个 0×0 的锚点：漫游中钉在屏幕正中当准星，自由视角下钉在光标处（.free）。
     子元素相对锚点用 translate 定位，这样圆环才能精确落在锚点上。 */
  #view-museum .aim {
    position: fixed; left: 50%; top: 50%; width: 0; height: 0; z-index: 22;
    opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
  }
  #view-museum .aim.on { opacity: 1; }
  #view-museum .aim .ring {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    width: 13px; height: 13px; border-radius: 50%;
    border: 1.5px solid rgba(239,231,211,0.95);
    box-shadow: 0 0 0 4px rgba(239,231,211,0.14), 0 1px 6px rgba(0,0,0,0.6);
  }
  #view-museum .aim .tip {
    position: absolute; left: 0; top: 22px; transform: translateX(-50%);
    white-space: nowrap; font-size: 13px; letter-spacing: 0.16em;
    color: #efe7d3; background: rgba(20,18,14,0.78);
    border: 1px solid rgba(239,231,211,0.38); border-radius: 18px;
    padding: 8px 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  }
  /* 自由视角：不摆准星，气泡跟在光标右下 */
  #view-museum .aim.free .ring { display: none; }
  #view-museum .aim.free .tip {
    left: 8px; top: 8px; transform: none; font-size: 12px; padding: 6px 13px;
  }
  /* 漫游中「没对着展品」时的提示压暗一档，别抢戏 */
  #view-museum .aim.dim .tip { opacity: 0.55; }

  #info {
    position: fixed; left: 28px; bottom: 30px; z-index: 20; width: 320px;
    background: rgba(20,18,14,0.82); border: 1px solid rgba(239,231,211,0.18);
    border-radius: 12px; padding: 18px 20px; backdrop-filter: blur(8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    opacity: 0; transform: translateY(12px); pointer-events: none;
  }
  #info.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #info .sw { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  #info .sw .chip { width: 34px; height: 34px; border-radius: 8px; }
  #info .sw .nm { font-size: 22px; font-weight: 700; letter-spacing: 0.08em; }
  #info .sw .hex { font-size: 11px; letter-spacing: 0.08em; color: rgba(239,231,211,0.6); }
  #info .obj { font-size: 12px; color: rgba(239,231,211,0.85); line-height: 1.6; }
  #info .poem { margin-top: 10px; font-size: 13px; line-height: 1.7; color: rgba(239,231,211,0.9); }
  #info .poem .au { font-size: 11px; color: rgba(239,231,211,0.55); }
  /* 信息卡上的「展卷」按钮（注意不要复用卷轴的 .btn，那会串样式） */
  #info .open-scroll {
    display: block; width: 100%; margin-top: 13px; padding: 9px 14px;
    cursor: pointer; font-family: inherit; font-size: 12px; letter-spacing: 0.16em;
    background: rgba(239,231,211,0.1); color: #efe7d3;
    border: 1px solid rgba(239,231,211,0.3); border-radius: 8px;
    transition: background 0.2s ease;
  }
  #info .open-scroll:hover { background: rgba(239,231,211,0.22); }

  #loading {
    position: fixed; inset: 0; z-index: 40; background: var(--desk);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: opacity 0.6s ease;
  }
  #loading .t { font-size: 16px; letter-spacing: 0.2em; }
  #loading .p { font-size: 12px; letter-spacing: 0.1em; color: rgba(239,231,211,0.55); }
  #loading.hide { opacity: 0; pointer-events: none; }

  /* ============================================================
     视图 B · 色谱长卷
     ============================================================ */
  #view-scroll {
    background: radial-gradient(120% 90% at 50% 0%, #1c1913 0%, var(--desk) 55%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  /* 复入时只做短淡入（注意：opacity 不会让 fixed 子元素改变定位基准） */
  #view-scroll.fade { animation: viewFade 0.35s ease both; }
  @keyframes viewFade { from { opacity: 0; } to { opacity: 1; } }

  #view-scroll header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 30px;
    background: linear-gradient(180deg, rgba(20,18,14,0.9), rgba(20,18,14,0));
    pointer-events: none;
  }
  #view-scroll header .brand { display: flex; align-items: baseline; gap: 12px; pointer-events: auto; }
  #view-scroll header .cn { font-size: 19px; font-weight: 700; letter-spacing: 0.16em; color: #efe7d3; }
  #view-scroll header .en { font-size: 9px; letter-spacing: 0.28em; color: rgba(239,231,211,0.5); text-transform: uppercase; }
  #view-scroll .dots { display: flex; gap: 9px; pointer-events: auto; }
  #view-scroll .dot {
    width: 13px; height: 13px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(239,231,211,0.25); background: #3a352b;
    transition: transform 0.2s ease;
  }
  #view-scroll .dot.on { transform: scale(1.45); border-color: #efe7d3; }

  /* 返回按钮固定在**左下角**：卷轴画心占满整屏，放顶栏里会被画面抢掉注意力。
     DOM 上它也从 <header> 里挪了出来（header 是 fixed + pointer-events:none）。 */
  #view-scroll .back-btn {
    position: fixed; left: 26px; bottom: 26px; z-index: 30;
    pointer-events: auto; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 700; letter-spacing: 0.16em;
    background: rgba(20,18,14,0.8); color: #efe7d3;
    border: 1px solid rgba(239,231,211,0.5); border-radius: 26px;
    padding: 12px 26px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }
  #view-scroll .back-btn:hover {
    background: rgba(20,18,14,0.98); border-color: #efe7d3; transform: translateY(-2px);
  }

  /* 卷轴舞台 */
  #view-scroll .stage {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 7vh 2vw 6vh;
  }
  #view-scroll .roller {
    position: absolute; top: 7vh; height: 84vh; width: 30px; z-index: 12;
    border-radius: 15px;
    background: linear-gradient(90deg, #3f2d18 0%, #b98a52 30%, #d9b277 50%, #9a703d 72%, #3a2a15 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,0.55), inset 0 0 4px rgba(255,255,255,0.15);
  }
  #view-scroll .roller::before,
  #view-scroll .roller::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    width: 44px; height: 22px; border-radius: 11px;
    background: radial-gradient(circle at 40% 32%, #e2c084, #8a6436 68%, #5c3f1e);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  #view-scroll .roller::before { top: -12px; }
  #view-scroll .roller::after { bottom: -12px; }
  #view-scroll .roller.left { left: 50%; margin-left: -15px; animation: rollL 2.2s cubic-bezier(0.22,0.61,0.36,1) 0.15s both; }
  #view-scroll .roller.right { right: 50%; margin-right: -15px; animation: rollR 2.2s cubic-bezier(0.22,0.61,0.36,1) 0.15s both; }
  @keyframes rollL { to { left: 1.5vw; margin-left: 0; } }
  @keyframes rollR { to { right: 1.5vw; margin-right: 0; } }

  /* 画心 */
  #view-scroll .viewport {
    position: relative; height: 84vh; width: var(--segw); max-width: 96vw;
    background-color: var(--paper);
    background-image: url('assets/paper_texture.jpg');
    background-size: cover; background-blend-mode: multiply;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
    clip-path: inset(0 50% 0 50%);
    animation: reveal 2.2s cubic-bezier(0.22,0.61,0.36,1) 0.15s both;
  }
  @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
  #view-scroll .viewport::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    box-shadow: inset 0 0 60px rgba(120,90,40,0.28), inset 0 0 6px rgba(120,90,40,0.3);
  }

  /* ⚠️ 揭幕/铺开动画写在基础选择器上，没有可切换的类名；
     而浏览器在 display:none → block 时会重启动画，所以每次复入都会重播 2.2s。
     用 .settled 把三个动画钉在终态，复入就只走上面那条淡入。 */
  #view-scroll.settled .viewport { animation: none; clip-path: inset(0 0 0 0); }
  #view-scroll.settled .roller.left { animation: none; left: 1.5vw; margin-left: 0; }
  #view-scroll.settled .roller.right { animation: none; right: 1.5vw; margin-right: 0; }

  #view-scroll .scroll {
    position: absolute; inset: 0; display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  #view-scroll .scroll::-webkit-scrollbar { display: none; }
  #view-scroll .seg { flex: 0 0 var(--segw); height: 100%; scroll-snap-align: start; position: relative; }

  /* 引首 / 拖尾 */
  #view-scroll .seg.intro,
  #view-scroll .seg.outro {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: 22px; padding: 0 8vw;
  }
  #view-scroll .seg.intro .title { font-size: clamp(34px, 5vw, 60px); font-weight: 800; letter-spacing: 0.12em; color: var(--ink); line-height: 1.35; }
  #view-scroll .seg.intro .sub { font-size: 11px; letter-spacing: 0.4em; color: var(--ink-soft); }
  #view-scroll .strip { display: flex; gap: 3px; }
  #view-scroll .strip i { width: 38px; height: 52px; border-radius: 3px; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  #view-scroll .seg.intro .hint { font-size: 11px; letter-spacing: 0.3em; color: var(--ink-soft); }
  #view-scroll .seg.outro .ot { font-size: 20px; letter-spacing: 0.2em; color: var(--ink); margin-bottom: 6px; font-weight: 700; }
  #view-scroll .seg.outro .ol { max-width: 600px; font-size: 12.5px; line-height: 2.1; color: #5a513c; text-align: left; }

  /* 色段 */
  #view-scroll .seg.color { display: flex; flex-direction: column; }
  #view-scroll .banner {
    flex: 0 0 26%; min-height: 150px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px; position: relative; overflow: hidden;
    transition: background-color 0.4s ease;
  }
  #view-scroll .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,0.08), rgba(0,0,0,0.06)); }
  #view-scroll .banner .bn { font-size: clamp(48px, 7vw, 96px); font-weight: 800; letter-spacing: 0.02em; color: var(--on); position: relative; z-index: 1; line-height: 0.9; }
  #view-scroll .banner .bd { text-align: right; position: relative; z-index: 1; }
  #view-scroll .banner .bd .hex { font-size: 21px; letter-spacing: 0.05em; color: var(--on); }
  #view-scroll .banner .bd .rgb { font-size: 11px; color: var(--on); opacity: 0.7; margin-top: 5px; letter-spacing: 0.12em; }

  #view-scroll .seg-body { flex: 1; display: flex; flex-direction: column; padding: 22px 44px 20px; min-height: 0; }
  #view-scroll .seg-mid { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 18px; flex: 1; min-height: 0; }
  #view-scroll .card {
    background: rgba(255,255,255,0.42); border: 1px solid rgba(90,75,45,0.22); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; min-height: 0;
  }
  #view-scroll .card-head { font-size: 10px; letter-spacing: 0.26em; color: var(--ink-soft); margin-bottom: 11px; padding-bottom: 8px; border-bottom: 1px solid rgba(90,75,45,0.2); }
  #view-scroll .imgw { flex: 1; background: #fff; border-radius: 7px; overflow: hidden; min-height: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.16); }
  #view-scroll .imgw img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #view-scroll .cap { margin-top: 11px; }
  #view-scroll .cap .obj { font-size: 12.5px; font-weight: 700; line-height: 1.5; color: var(--ink); }
  #view-scroll .cap .muse { font-size: 10.5px; color: var(--ink-soft); margin-top: 3px; }
  #view-scroll .cap .src { margin-top: 7px; padding-top: 7px; border-top: 1px dashed rgba(90,75,45,0.3); font-size: 9.5px; color: #8a7d63; line-height: 1.5; }
  #view-scroll .poem-wrap { flex: 1; display: flex; align-items: center; justify-content: center; gap: 11px; }
  #view-scroll .poem-wrap .pt { writing-mode: vertical-rl; text-orientation: upright; font-size: 20px; letter-spacing: 0.24em; line-height: 1.5; color: var(--ink); }
  #view-scroll .poem-wrap .au { writing-mode: vertical-rl; font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.14em; }

  #view-scroll .seg-foot { margin-top: 18px; display: flex; gap: 36px; align-items: flex-start; }
  #view-scroll .seg-foot .meaning { font-size: 13.5px; line-height: 1.95; color: #4a4230; max-width: 540px; }
  #view-scroll .seg-foot .meta { font-size: 11.5px; line-height: 1.85; color: var(--ink-soft); }
  #view-scroll .seg-foot .meta b { color: var(--ink); letter-spacing: 0.04em; }

  /* 控制（必须留在 #view-scroll 内，否则会浮在 3D 视图上） */
  #view-scroll .controls { position: fixed; bottom: 24px; right: 2.6vw; z-index: 30; display: flex; gap: 10px; }
  #view-scroll .btn {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(239,231,211,0.28); background: rgba(20,18,14,0.55);
    color: #efe7d3; font-size: 17px; line-height: 1;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  #view-scroll .btn:hover { background: rgba(20,18,14,0.9); transform: translateY(-2px); }
  #view-scroll .pbar { position: fixed; bottom: 0; left: 0; right: 0; height: 3px; z-index: 30; background: rgba(255,255,255,0.07); }
  #view-scroll .pbar i { display: block; height: 100%; width: 0; background: #d9b277; transition: width 0.25s ease; }

  /* 顶栏工具区（色点 + 配乐开关） */
  #view-museum .tools { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
  #view-museum .hbtn {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-family: inherit; font-size: 13px; line-height: 1;
    background: rgba(20,18,14,0.55); color: #efe7d3;
    border: 1px solid rgba(239,231,211,0.25);
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  #view-museum .hbtn:hover { background: rgba(20,18,14,0.9); }
  #view-museum .hbtn.on { background: rgba(217,178,119,0.9); color: #241d12; border-color: #d9b277; }
  #view-museum .hbtn.off { opacity: 0.3; cursor: not-allowed; }

  /* ============================================================
     视图 C · 观画（全屏放大 + 引导词 + 配乐）　与卷轴同属「离开展厅」的模态
     ============================================================ */
  #view-painting {
    background: radial-gradient(120% 90% at 50% 0%, #1a1712 0%, #0d0b08 62%);
    color: #efe7d3; overflow: auto;
  }
  #view-painting header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 26px; pointer-events: none;
    background: linear-gradient(180deg, rgba(20,18,14,0.92), rgba(20,18,14,0));
  }
  #view-painting header .cn { font-size: 17px; font-weight: 700; letter-spacing: 0.16em; }
  #view-painting header .en { font-size: 9px; letter-spacing: 0.26em; color: rgba(239,231,211,0.5); }
  #view-painting .back-btn {
    pointer-events: auto; cursor: pointer; font-family: inherit;
    font-size: 12px; letter-spacing: 0.14em;
    background: rgba(20,18,14,0.6); color: #efe7d3;
    border: 1px solid rgba(239,231,211,0.28); border-radius: 18px;
    padding: 7px 16px; transition: background 0.2s ease;
  }
  #view-painting .back-btn:hover { background: rgba(20,18,14,0.95); }

  #view-painting .pstage {
    display: flex; gap: 30px; align-items: flex-start; justify-content: center;
    padding: 80px 30px 36px; min-height: 100%;
  }
  /* 画框（立轴装裱：深木框 + 内金线） */
  #view-painting .pframe {
    position: relative; flex: 0 1 auto;
    border: 11px solid #463a24; border-radius: 3px;
    box-shadow: 0 26px 72px rgba(0,0,0,0.7), inset 0 0 0 2px #a8853f;
    background: #cfc0a0; line-height: 0;
  }
  #view-painting .pframe img { max-width: 100%; max-height: 74vh; display: block; margin: 0 auto; }
  #view-painting .pph {
    width: 46vw; min-width: 300px; height: 58vh; min-height: 300px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 26px; text-align: center; line-height: 1.9;
    background: linear-gradient(150deg, #e7dcbd, #dccca6 55%, #ceb98f);
    color: #6b5b3c;
  }
  #view-painting .pph .t { font-size: 23px; letter-spacing: 0.2em; }
  #view-painting .pph .s { font-size: 11.5px; letter-spacing: 0.08em; opacity: 0.85; }
  #view-painting .pspots { position: absolute; inset: 0; pointer-events: none; }
  #view-painting .pspot {
    position: absolute; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.5); cursor: pointer; pointer-events: auto;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  #view-painting .pspot:hover { box-shadow: 0 0 0 3px rgba(0,0,0,0.6), 0 0 0 7px rgba(217,178,119,0.7); }
  #view-painting .pspot.on { transform: scale(1.45); box-shadow: 0 0 0 3px #241d12, 0 0 0 7px #d9b277; }
  #view-painting .pside { flex: 0 1 380px; min-width: 290px; display: flex; flex-direction: column; gap: 18px; }
  #view-painting .ptitle { font-size: 24px; letter-spacing: 0.12em; }
  #view-painting .ptitle .au { display: block; margin-top: 7px; font-size: 11.5px; letter-spacing: 0.14em; color: rgba(239,231,211,0.55); }

/* 八边形外墙（每段一色）。南(+Z) / 北(−Z) 各开一个门洞，
   通向序厅与内厅；门洞按角度把墙段切开，切口由门套遮住。 */
const DOOR_HALF_ARC = 0.13;                      // 门洞半张角（弧度）≈7.4°，净宽约 3.6
const DOOR_SPANS = [Math.PI/2, Math.PI*1.5].map(a => [a - DOOR_HALF_ARC, a + DOOR_HALF_ARC]);

/* 把 [lo,hi] 里被 holes 覆盖的区间挖掉，返回剩下的实心区间 */
function solidSpans(lo, hi, holes) {
  let parts = [[lo, hi]];
  for (const [h0, h1] of holes) {
    const out = [];
    for (const [s0, s1] of parts) {
      if (h1 <= s0 || h0 >= s1) { out.push([s0, s1]); continue; }
      if (s0 < h0) out.push([s0, h0]);
      if (h1 < s1) out.push([h1, s1]);
    }
    parts = out;
  }
  return parts.filter(([s0, s1]) => s1 - s0 > 1e-3);
}

/* 透明玻璃展柜（黄铜包边）：底座上罩一个圆筒玻璃罩 */
function buildVitrine(radius, height, baseY) {
  const g = new THREE.Group();
  const shell = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, height, 40, 1, true), GLASS_MAT);
  shell.position.y = baseY + height / 2;
  g.add(shell);
  const lid = new THREE.Mesh(new THREE.CircleGeometry(radius, 40), GLASS_MAT);
  lid.rotation.x = -Math.PI / 2;
  lid.position.y = baseY + height;
  g.add(lid);
  [baseY + 0.045, baseY + height - 0.045].forEach(y => {
    const rim = new THREE.Mesh(
      new THREE.CylinderGeometry(radius + 0.025, radius + 0.025, 0.07, 40, 1, true), BRASS_MAT);
    rim.position.y = y;
    g.add(rim);
  });
  for (let k = 0; k < 3; k++) {
    const a = k / 3 * Math.PI * 2 + Math.PI / 2;
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.045, height, 0.045), BRASS_MAT);
    post.position.set(Math.cos(a) * radius, baseY + height / 2, Math.sin(a) * radius);
    post.castShadow = true;
    g.add(post);
  }
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 16), BRASS_MAT);
  knob.position.y = baseY + height + 0.055;
  g.add(knob);
  return g;
}

/* ============================================================

   柜型服从器物：袍 → 低倾角长条立柜 / 花篮 → 八边形地平柜

   lift = 文物最长边归一化尺寸；holderY = 文物底面落位；hit = 拾取代理 [r, h, 中心y]
   ============================================================ */
/* lift 取值依据 —— 8 个 .glb 的世界包围盒实测（`python tools/glb_info.py assets/models/*.glb`，

     罐     0.940 × 1.097 × 0.936（立姿）

   8 件网格都是 3 万面（杏黄 29986），贴图统一压到 1024² JPEG（见 tools/shrink_glb.py） */
/* plinth = 台座高度（第 19 轮）：地平四柜整体站上 PLINTH_H 的台座，参观者不必弯腰。
   plaque = [展签柱脚 y, 柱脚 z]（第 20 轮）：柱脚落在柜子自己的石台/木底/圆台顶面上，

   ⚠️ 下面的 holderY / gazeY / hit / lightY 都是**台座之上的世界高度**（已把 +0.55 加进去）；
      改 PLINTH_H 时这一整张表跟着重算，别只改 PLINTH_H。
      改柜体尺寸时 plaque 的 z 要复核：柱脚必须在玻璃之外、且不越出台座/柜底的前沿
      （几座柜子的余量只有 1~3cm，见 §7.7）。 */

  basket: { lift:0.80, holderY:0.93, base:false, plinth:0.55, rot:[0, 0],         gazeY:1.47, hit:[1.24, 1.80, 0.90], plaque:[0.65, 1.15],  lightY:2.55 },

function glassPlane(w, h) { return new THREE.Mesh(new THREE.PlaneGeometry(w, h), GLASS_MAT); }
function brassSq(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), BRASS_MAT);
  m.position.set(x, y, z);
  return m;
}

/* 长方体玻璃立柜：4 片立壁 + 顶盖（tilt>0 时正对观众那一边压低）+ 上下黄铜框 + 4 角柱。
   顶盖低边正好压在墙顶，高边由背面两根加高角柱撑住（2*drop），斜面两侧的缝隙在玻璃下几乎不可见 */
function glassBoxCase(w, d, y0, y1, tilt) {
  const t = tilt || 0, g = new THREE.Group(), h = y1 - y0, cy = (y0 + y1) / 2;
  const wall = (pw, ry, px, pz) => {
    const m = glassPlane(pw, h); m.position.set(px, cy, pz); m.rotation.y = ry; g.add(m);
  };
  wall(w, 0, 0, d / 2);                    // 正面长壁
  wall(w, Math.PI, 0, -d / 2);             // 背面长壁
  wall(d, Math.PI / 2, w / 2, 0);          // 右短壁
  wall(d, -Math.PI / 2, -w / 2, 0);        // 左短壁

  const dLid = d * Math.cos(t) + 0.10;
  const drop = (dLid / 2) * Math.sin(t);
  const lid = glassPlane(w + 0.06, dLid);
  lid.rotation.x = -Math.PI / 2 + t;
  lid.position.y = y1 + 0.02 + drop;
  g.add(lid);

  [y0, y1].forEach(y => {                  // 上下黄铜框条
    g.add(brassSq(w + 0.06, 0.055, 0.055, 0, y, d / 2), brassSq(w + 0.06, 0.055, 0.055, 0, y, -d / 2));
    g.add(brassSq(0.055, 0.055, d + 0.06, w / 2, y, 0), brassSq(0.055, 0.055, d + 0.06, -w / 2, y, 0));
  });
  /* 4 根角柱：正面两根到墙顶，背面两根加高 2*drop 撑住顶盖高边 */
  [[1, 1, 0], [-1, 1, 0], [1, -1, 2 * drop], [-1, -1, 2 * drop]].forEach(([sx, sz, extra]) => {
    const post = brassSq(0.05, h + extra, 0.05, sx * w / 2, cy + extra / 2, sz * d / 2);
    post.castShadow = true;
    g.add(post);
    if (extra) {                            // 加高的两根顶上补个顶珠，说明它是有意撑高的
      const k = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), BRASS_MAT);
      k.position.set(sx * w / 2, y1 + extra + 0.045, sz * d / 2);
      g.add(k);
    }
  });
  return g;
}

/* 袍类：低倾角长条形玻璃立柜（顶盖倾 10°，正面压低）。柜体 1.80 × 1.00，
   四角半径 1.03 < 圆台顶面半径 1.05 → 整只柜子正好坐进原底座，不外挑 */
function caseRobe() { return glassBoxCase(1.80, 1.00, 0.33, 2.66, 0.1745); }

/* 通用落地石台：让地平柜有个实体基座（否则玻璃壁悬空、文物像浮在地板上） */
const STONE_MAT = new THREE.MeshStandardMaterial({ color: '#e6e0d2', roughness: 0.6 });
function stoneSlab(r, h) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 24), STONE_MAT);
  m.position.y = h / 2; m.receiveShadow = true;
  return m;
}

/* 罐类：方正立体独立柜（平顶，不倾） */
function caseJar() {
  const g = glassBoxCase(1.45, 1.45, 0.10, 1.45, 0);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.10, 1.55), STONE_MAT);
  slab.position.y = 0.05; slab.receiveShadow = true;
  g.add(slab);
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.28, 0.62), STONE_MAT);
  plinth.position.y = 0.24; plinth.receiveShadow = true;   // 顶面 0.38 = holderY
  g.add(plinth);
  return g;
}

/* 花篮：八边形地平独立柜。thetaStart=π/8 让一个平面正对观众（+Z），
   4 根铜柱落在八边形的交替顶点上 */
function caseBasket() {
  const R = 1.15, y0 = 0.10, y1 = 1.20, g = new THREE.Group();
  const oct = (r, hh, open) => new THREE.CylinderGeometry(r, r, hh, 8, 1, open, Math.PI / 8);
  const shell = new THREE.Mesh(oct(R, y1 - y0, true), GLASS_MAT);
  shell.position.y = (y0 + y1) / 2;
  g.add(shell);
  const lid = new THREE.Mesh(oct(R, 0.03, false), GLASS_MAT);
  lid.position.y = y1 + 0.02;
  g.add(lid);
  [y0, y1].forEach(y => {
    const rim = new THREE.Mesh(oct(R + 0.03, 0.06, true), BRASS_MAT);
    rim.position.y = y;
    g.add(rim);
  });
  [0, 2, 4, 6].forEach(k => {
    const th = Math.PI / 8 + k * Math.PI / 4;
    const post = brassSq(0.05, y1 - y0, 0.05, Math.sin(th) * R, (y0 + y1) / 2, Math.cos(th) * R);
    post.castShadow = true;
    g.add(post);
  });
  const plinth = new THREE.Mesh(oct(0.5, 0.28, false), STONE_MAT);
  plinth.position.y = y0 + 0.14; plinth.receiveShadow = true;   // 顶面 0.38 = holderY
  g.add(plinth);
  g.add(stoneSlab(1.20, y0));                                   // 落地石台，柜体不再悬空
  return g;
}

/* 盘：带倾角的圆形地平斜柜。圆筒矮柜 + 圆顶盖倾 10°（正面压低，背面两根铜柱撑高边） */
function caseDish() {
  const R = 1.00, y0 = 0.10, y1 = 0.85, TILT = 0.1745, g = new THREE.Group();   // 10°
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(R, R, y1 - y0, 48, 1, true), GLASS_MAT);
  shell.position.y = (y0 + y1) / 2;
  g.add(shell);
  const dLid = 2 * R + 0.08, drop = (dLid / 2) * Math.sin(TILT);
  const lid = new THREE.Mesh(new THREE.CircleGeometry(dLid / 2, 48), GLASS_MAT);
  lid.rotation.x = -Math.PI / 2 + TILT;
  lid.position.y = y1 + 0.02 + drop;
  g.add(lid);
  [y0, y1].forEach(y => {
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.03, R + 0.03, 0.06, 48, 1, true), BRASS_MAT);
    rim.position.y = y;
    g.add(rim);
  });
  [-1, 1].forEach(sx => {
    const post = brassSq(0.05, (y1 - y0) + 2 * drop, 0.05, sx * R * 0.7, (y0 + y1) / 2 + drop, -R * 0.7);
    post.castShadow = true;
    g.add(post);
  });
  g.add(stoneSlab(R + 0.05, y0));                 // 落地石台
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.12, 48), STONE_MAT);
  plinth.position.y = 0.16; plinth.receiveShadow = true;   // 顶面 0.22 = holderY（盘立其上）
  g.add(plinth);
  return g;
}

/* 帛书：长条斜面展柜。直角梯形截面（正面矮 0.45、背面高 0.90），顶面即斜面 25°，
   配木底板与木前后沿（帛书配木案更贴切） */
function caseScroll() {
  const W = 2.20, D = 0.95, y0 = 0.12, yF = 0.45, yB = 0.90, g = new THREE.Group();
  const fw = glassPlane(W, yF - y0); fw.position.set(0, (y0 + yF) / 2, D / 2); g.add(fw);
  const bw = glassPlane(W, yB - y0); bw.position.set(0, (y0 + yB) / 2, -D / 2); g.add(bw);
  /* 两侧梯形玻璃壁：Shape 造形在 XY 面（X 当进深），绕 Y 旋 -90° 立起来 */
  const sh = new THREE.Shape();
  sh.moveTo(D / 2, y0); sh.lineTo(D / 2, yF); sh.lineTo(-D / 2, yB); sh.lineTo(-D / 2, y0); sh.closePath();
  const sg = new THREE.ShapeGeometry(sh);
  [-1, 1].forEach(sx => {
    const m = new THREE.Mesh(sg, GLASS_MAT); m.rotation.y = -Math.PI / 2; m.position.x = sx * W / 2; g.add(m);
  });
  /* 斜面顶盖 */
  const top = glassPlane(W + 0.06, Math.hypot(D, yB - yF) + 0.06);
  top.rotation.x = -Math.PI / 2 + Math.atan2(yB - yF, D);
  top.position.set(0, (yF + yB) / 2 + 0.02, 0);
  g.add(top);
  /* 木底板 + 木前后沿 + 铜包角柱 */
  const base = new THREE.Mesh(new THREE.BoxGeometry(W + 0.12, 0.12, D + 0.08), WOOD_MAT);
  base.position.y = y0 / 2; base.receiveShadow = true; g.add(base);
  [[D / 2, yF], [-D / 2, yB]].forEach(([pz, py]) => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(W + 0.12, 0.10, 0.07), WOOD_MAT);
    rail.position.set(0, py - 0.05, pz); rail.castShadow = true; g.add(rail);
  });
  [[1, D / 2, yF], [-1, D / 2, yF], [1, -D / 2, yB], [-1, -D / 2, yB]].forEach(([sx, pz, py]) => {
    const post = brassSq(0.05, py - y0, 0.05, sx * W / 2, (y0 + py) / 2, pz);
    post.castShadow = true; g.add(post);
  });
  /* 柜内木展板（帛书平铺其上） */
  const board = new THREE.Mesh(new THREE.BoxGeometry(W - 0.30, 0.16, D - 0.33), WOOD_MAT);
  board.position.y = y0 + 0.08; board.receiveShadow = true;   // 顶面 0.28 = holderY
  g.add(board);
  return g;
}

/* ---------- 台座：把四座地平柜整体升到腰高（2026-10-12 第 19 轮）----------
   原本四座柜直接落地、文物贴在柜底（底面只有 22~38cm），参观者得弯腰看。
   现在整柜站上一座 0.55m 高的台座，柜型（八边形 / 圆形 / 长条斜面案 / 方正）
   一个都不改，只是从「落地」变成「上台」。
   台座取须弥座式的三段（下枋─束腰─上枋），**束腰刻云龙纹**。
   「不要太张扬」的做法：纹样是同色系浅刻——色彩对比压到极低（#c3baa7 on #cfc7b6），
   起伏只有 2cm 级的 bump；远看只是一个素净台座，走近才看得出云头和龙首。 */

/* 云头：两瓣卷云 + 云尾（如意云纹的骨架） */
function cloudHead(ctx, x, y, s) {
  ctx.beginPath();
  ctx.arc(x - s * 0.34, y, s * 0.6, Math.PI * 0.35, Math.PI * 1.9);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + s * 0.36, y - s * 0.1, s * 0.46, Math.PI * 1.05, Math.PI * 0.72);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - s * 0.72, y + s * 0.5);
  ctx.quadraticCurveTo(x, y + s * 0.96, x + s * 0.78, y + s * 0.42);
  ctx.stroke();
}
/* 龙首：侧面龙（颈─首─吻─角─目─须），比画整条龙稳，缩小后也能认出是龙 */
function dragonHead(ctx, x, y, s) {
  ctx.beginPath();                                   // 龙颈
  ctx.moveTo(x - s * 0.6, y + s * 0.55);
  ctx.quadraticCurveTo(x - s * 0.2, y + s * 0.12, x + s * 0.1, y - s * 0.05);
  ctx.stroke();
  ctx.beginPath();                                   // 头 + 吻
  ctx.moveTo(x - s * 0.12, y - s * 0.16);
  ctx.quadraticCurveTo(x + s * 0.24, y - s * 0.46, x + s * 0.6, y - s * 0.2);
  ctx.quadraticCurveTo(x + s * 0.86, y - s * 0.04, x + s * 0.68, y + s * 0.14);
  ctx.quadraticCurveTo(x + s * 0.42, y + s * 0.32, x + s * 0.08, y + s * 0.16);
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();                                   // 角
  ctx.moveTo(x + s * 0.06, y - s * 0.3);
  ctx.quadraticCurveTo(x - s * 0.12, y - s * 0.76, x - s * 0.48, y - s * 0.68);
  ctx.stroke();
  ctx.beginPath();                                   // 目
  ctx.arc(x + s * 0.34, y - s * 0.07, s * 0.075, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();                                   // 须
  ctx.moveTo(x + s * 0.66, y + s * 0.11);
  ctx.quadraticCurveTo(x + s * 1.0, y + s * 0.36, x + s * 0.58, y + s * 0.62);
  ctx.stroke();
}

function paintMotif(ctx, W, H, paper, ink) {
  ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = ink; ctx.lineCap = 'round';
  ctx.lineWidth = 3;                                 // 束腰上下弦线
  [86, 170].forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); });
  ctx.lineWidth = 4;
  for (let i = 0; i < 8; i++) {                      // 云头与龙首相间
    const x = 32 + i * 64, y = 128;
    if (i % 2) dragonHead(ctx, x, y, 20); else cloudHead(ctx, x, y, 22);
  }
}
const PLINTH_H = 0.55;
/* 台座材质按「横向重复数」缓存（只有 2 和 3 两种）。
   ⚠️ 别用 MOTIF_TEX.clone() 省事：three r152+ 按 source 共享同一张 WebGL 贴图，
      而 map(sRGB) 与 bumpMap(线性) 的 colorSpace 不同，共用会互相覆盖内部格式。
      各自 canvasTex() 生成一张最稳，两张 512×256 也就几十 KB。 */
const motifCache = {};
function motifMat(rx) {
  if (!motifCache[rx]) {
    const map = canvasTex(512, 256, (c, w, h) => paintMotif(c, w, h, '#cfc7b6', '#c3baa7'));
    const bumpMap = canvasTex(512, 256, (c, w, h) => paintMotif(c, w, h, '#ffffff', '#000000'));
    bumpMap.colorSpace = THREE.NoColorSpace;         // bumpMap 是数据贴图，不能当颜色
    map.wrapS = bumpMap.wrapS = THREE.RepeatWrapping;
    map.repeat.set(rx, 1); bumpMap.repeat.set(rx, 1);
    motifCache[rx] = new THREE.MeshStandardMaterial({
      color: '#cfc7b6', roughness: 0.62,
      map, bumpMap, bumpScale: 0.02
    });
  }
  return motifCache[rx];
}

const PLINTH_FOOT = {          // [台座平面尺寸 W × D, 纹样横向重复数]
  basket: [2.40, 2.40, 3], dish: [2.20, 2.20, 3],
  scroll: [2.46, 1.16, 3], jar: [1.84, 1.84, 2]
};
function buildPedestal(kind) {
  const [W, D, rx] = PLINTH_FOOT[kind];
  const g = new THREE.Group();
  const capH = 0.06, shaftH = PLINTH_H - capH * 2;   // 0.43
  const cap = new THREE.Mesh(new THREE.BoxGeometry(W, capH, D), STONE_MAT);
  cap.position.y = capH / 2; cap.receiveShadow = cap.castShadow = true; g.add(cap);
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(W - 0.16, shaftH, D - 0.16), motifMat(rx));
  shaft.position.y = capH + shaftH / 2;
  shaft.receiveShadow = shaft.castShadow = true;
  g.add(shaft);
  const top = new THREE.Mesh(new THREE.BoxGeometry(W, capH, D), STONE_MAT);
  top.position.y = PLINTH_H - capH / 2; top.receiveShadow = top.castShadow = true; g.add(top);
  return g;                                          // 顶面正好 PLINTH_H
}

function buildCase(kind) {
  switch (kind) {
    case 'robe':   return caseRobe();
    case 'basket': return caseBasket();
    case 'dish':   return caseDish();
    case 'scroll': return caseScroll();
    default:       return caseJar();
  }
}

const exhibits = [];
const loader = new GLTFLoader();
const MODEL_IDS = ['jilan', 'yuebai', 'songhua', 'shiqing', 'ouhe', 'canghuang', 'dailan', 'xinghuang'];
let loaded = 0;

   逐帧 pointermove 检测会卡；用圆柱代理一次覆盖整件展品。
   已核实 three@0.160.0：Raycaster 只查 object.layers，

const PLAQUE_Y = 1.00;                 // 展签牌心高度（8 座统一，抬手可读）

COLORS.forEach((c, i) => {

    base.position.y = 0.16; base.castShadow = base.receiveShadow = true;
    grp.add(base);
    const pillar = new THREE.Mesh(

  const haloR = spec.plinth ? [1.80, 1.98] : [1.30, 1.42];

  const holder = new THREE.Group();

  const hb = new THREE.Mesh(

  exhibits.push({ c, i, grp, holder, a, x, z, pickRing, spec });
});

/* 第三单元 8 座展台建完之后再挂标题带：CJK 是 const，声明在第 1202 行，

/* 第三单元标题带 —— 与第一/第二/第四单元同款（5.6×1.2、深底金字、y=3.4）。

   半径取 MUSE_R − 0.04 = 13.96：墙面在 R=14 且法线朝圆心，**往圆心挪一点才是正面**，
   0.04 与 u1(−18.85/−18.89)、u2(−6.35/−6.39)、u4(18.35/18.39) 是同一个贴面间隙。
   rotY = −mid − π/2 让板面法线指向圆心；要改挂镜像那条 202.5° 面，用 (−12.90, 3.4, −5.34, +1.1781)。 */
plate(textBoardTex({ w:1024, h:220, bg:'#2a241b', fg:'#e8cf94', title:UNITS.u3.cn,

/* canvas 文字标签 */
/* ---------- 展签牌（第 20 轮）----------
   原来是一块 Sprite 广告牌：永远转向镜头、depthTest:false 还能穿墙，一眼假。
   现在改成**实物展签**——象牙色卡纸 + 黄铜背板，30° 斜置在展柜正前方的
   细铜柱上（柱脚落在柜子的石台/木底上，像拧上去的展签夹），跟真博物馆一样。
   倾角 30° 是按读牌几何定的：参观者眼高 1.7m、被 `blockers` 挡在柜心 1.7m 外，
   牌心抬到 1.00m 时视线俯角约 16°~52°，牌面法线朝上外 30° 正好落在视线的±26° 内，
   抬手即可读 —— 不用弯腰。
   （PLAQUE_* 四个常量声明在展台循环之前，见上文 `const CJK` 处的说明。） */

function makePlaque(c, idx, anchor) {
  const g = new THREE.Group();
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 192;
  const ctx = cv.getContext('2d');
  /* 馆签：象牙卡纸 + 双细线框 */
  ctx.fillStyle = '#f3ecdd'; ctx.fillRect(0, 0, 512, 192);
  ctx.strokeStyle = 'rgba(92,78,50,0.55)'; ctx.lineWidth = 3; ctx.strokeRect(9, 9, 494, 174);
  ctx.strokeStyle = 'rgba(92,78,50,0.25)'; ctx.lineWidth = 1; ctx.strokeRect(16, 16, 480, 160);
  /* 左边一块标本本色 */
  ctx.fillStyle = c.hex; ctx.fillRect(30, 48, 52, 96);
  ctx.strokeStyle = 'rgba(60,50,32,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(30, 48, 52, 96);
  /* 色名 + 色值 + 编号 */
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#241f16';
  ctx.font = `bold 76px ${CJK}`;
  ctx.fillText(c.name, 102, 118);
  ctx.fillStyle = '#6d6148';
  ctx.font = '28px ui-monospace,Consolas,monospace';
  ctx.fillText(c.hex.toUpperCase(), 104, 156);
  ctx.textAlign = 'right';
  ctx.fillText('NO.' + String(idx + 1).padStart(2, '0'), 476, 60);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  /* 牌面 + 黄铜背板（有厚度才像一块实物） */
  const board = new THREE.Group();
  const card = new THREE.Mesh(new THREE.PlaneGeometry(PLAQUE_W, PLAQUE_H),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.74 }));
  const back = new THREE.Mesh(
    new THREE.BoxGeometry(PLAQUE_W + 0.026, PLAQUE_H + 0.026, 0.016), BRASS_MAT);
  back.position.z = -0.011;
  card.castShadow = back.castShadow = true;
  back.receiveShadow = true;
  board.add(back, card);
  board.rotation.x = -PLAQUE_TILT;                 // 顶边后倒
  board.position.y = PLAQUE_Y - anchor[0];         // 牌心统一抬到 PLAQUE_Y
  g.add(board);
  /* 立柱：柱脚坐在柜子的石台/木底上（柱脚落在 anchor 的 y、z） */
  const postH = PLAQUE_Y - anchor[0];
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, postH, 12), BRASS_MAT);
  post.position.y = postH / 2; post.castShadow = true;
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.034, 0.016, 16), BRASS_MAT);
  collar.position.y = 0.008;
  g.add(post, collar);
  g.position.set(0, anchor[0], anchor[1]);
  return g;
}

const loadingBar = document.getElementById('lp');
const loadingEl = document.getElementById('loading');

function settle() {
  loaded++;
