/* ---------- 程序化袍服（4 件袍类 .glb 加载失败时的降级物）----------
   assets/models/ 现已 8 件齐全，四件**袍类**（月白 / 石青 / 藕合 / 杏黄）走真模型；
   这里只在 .glb 取不到时兜底 —— 与新设计里的 fallbackStand()（一块立在杆上的平板）
   相比，用 lathe 旋成型的袍子有立姿、肩线、立领、外展袖、胸前补子，
   塞进 `robe` 立柜里才像话。
   局部坐标：y=0 是下摆底边，朝 +z 为正面（挂点 lookAt 中心，故正面朝向观众）。 */
function buildGarment(hex) {
  const g = new THREE.Group();
  const cloth = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.72, metalness: 0.02, side: THREE.DoubleSide });
  // 领口用同色系深色、补子用织金，保持「一色一品」的展陈调性
  const deep = '#' + new THREE.Color(hex).multiplyScalar(0.5).getHexString();
  const trim = new THREE.MeshStandardMaterial({ color: deep, roughness: 0.45, metalness: 0.12 });
  const gold = new THREE.MeshStandardMaterial({ color: '#c8a55e', roughness: 0.38, metalness: 0.5 });

  // 衣身：用旋转体拉出「上窄下阔、肩部收圆」的整体剪影，
  // 比叠圆柱少了一圈台阶，更像一件袍子而不是灯罩
  const FLAT = 0.62;   // 前后压扁，做出衣物的厚度感
  const profile = [
    [0.40, 0.00],   // 下摆
    [0.395, 0.14],
    [0.365, 0.38],
    [0.325, 0.62],
    [0.30, 0.82],
    [0.288, 0.92],  // 肩线：保持宽度，别收成圆顶
    [0.268, 0.985],
    [0.165, 1.015], // 快速收到领口
    [0.105, 1.028],
    [0.00, 1.032],  // 封顶，避免从领口看进去是空的
  ].map(p => new THREE.Vector2(p[0], p[1]));
  const torso = new THREE.Mesh(new THREE.LatheGeometry(profile, 40), cloth);
  torso.scale.z = FLAT;
  g.add(torso);

  // 立领
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.125, 0.026, 10, 28), trim);
  collar.rotation.x = Math.PI / 2;   // 环面放平（局部 y → 世界 z）
  collar.position.y = 1.0;
  collar.scale.y = FLAT;
  g.add(collar);

  // 两袖：清式，袖口（外端）比肩部宽，横向外展并微微下垂
  [1, -1].forEach(s => {
    const arm = new THREE.Group();
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.105, 0.38, 24), cloth);
    sleeve.rotation.z = -s * Math.PI / 2;  // 轴转到 ±x，粗端（半径 0.15）指向袖口外侧
    sleeve.position.x = s * 0.19;
    arm.add(sleeve);
    arm.position.set(s * 0.21, 0.885, 0);
    arm.rotation.z = -s * 0.10;            // 袖口微微下垂
    arm.scale.z = 0.78;
    g.add(arm);
  });

  // 胸前补子：贴到衣身该高度处的曲面上
  const badge = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.02), gold);
  badge.position.set(0, 0.72, 0.312 * FLAT + 0.012);
  g.add(badge);

  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

/* 把程序化袍服按 `lift` 归一化并**贴底居中** —— 与 loadModel 里真模型的算式逐字一致。
   ⚠️ 不能省掉「重新量一次包围盒」这一步：袍子是 lathe + 分组转出来的，
   长边不一定落在 Y 上，用 lift/2 估会浮空。 */
function fitRobe(obj, lift) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  obj.scale.setScalar(lift / maxDim);
  obj.position.set(0, 0, 0);
  const box2 = new THREE.Box3().setFromObject(obj);
  const c2 = box2.getCenter(new THREE.Vector3());
  obj.position.set(-c2.x, -box2.min.y, -c2.z);
  return obj;
}

/* 加载失败时的分派：立柜（袍类）给程序化袍服，其余柜型沿用 fallbackStand 占位。
   8 件 .glb 现已全部就位，这条路径正常参观走不到 —— 但拔了 assets/models/ 也别空展台 */
function modelFallback(e) {
  return CASE_OF[e.c.id] === 'robe'
    ? fitRobe(buildGarment(e.c.hex), e.spec.lift)
    : fallbackStand(e.c.hex, e.spec.lift);
}

/* 占位展品：模型缺失或加载失败时降级，保证展台仍可点击。
   lift 与真模型同口径归一化，地平柜里的占位物才不会顶出柜顶 */
function fallbackStand(hex, lift) {
  const g = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({ color:'#5a5245', roughness:0.5 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.95, 16), frameMat);
  pole.position.y = 0.475;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.05, 16), frameMat);
  bar.rotation.z = Math.PI/2; bar.position.y = 0.95;
  const cloth = new THREE.Mesh(
    new THREE.BoxGeometry(0.85, 0.8, 0.15),
    new THREE.MeshStandardMaterial({ color:hex, roughness:0.6 })
  );
  cloth.position.y = 0.42; cloth.castShadow = true;
  g.add(pole, bar, cloth);
  g.scale.setScalar((lift || 1.15) / 1.15);
  return g;
}

function loadModel(e) {
  if (!MODEL_IDS.includes(e.c.id)) {
    e.holder.add(modelFallback(e));
    settle();
    return;
  }
  loader.load(`assets/models/${e.c.id}.glb`, (gltf) => {
    const m = gltf.scene;
    m.rotation.set(e.spec.rot[0], e.spec.rot[1], 0);   // 先摆正（帛书平铺，长边要转到柜长方向）
    const box = new THREE.Box3().setFromObject(m);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = e.spec.lift / maxDim;          // 文物尺寸随柜型适配（见 CASE_SPEC.lift）
    m.scale.setScalar(scale);
    /* 缩放后重新量一次，按包围盒底面贴合 holder 原点。
       ⚠️ 不能用 lift/2 顶替 —— 长边不在 Y 上时（帛书是平铺薄片）会浮在半空 */
    m.position.set(0, 0, 0);
    const box2 = new THREE.Box3().setFromObject(m);
    const c2 = box2.getCenter(new THREE.Vector3());
    m.position.set(-c2.x, -box2.min.y, -c2.z);
    m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    e.holder.add(m);
    settle();
  }, undefined, () => {
    /* ⚠️ 失败也必须计数，否则 #loading 遮罩永久停留（且合并后会同时挡住卷轴视图） */
    console.warn(`[传统古色] 模型加载失败，已降级为${CASE_OF[e.c.id] === 'robe' ? '程序化袍服' : '占位展品'}：assets/models/${e.c.id}.glb`);
    e.holder.add(modelFallback(e));
    settle();
  });
}
exhibits.forEach(loadModel);

/* ============================================================
   1.5 展陈空间：序厅 / 内厅 / 第一・第四单元 / 室外
   俯视布局（+Z 为南，参观起点在馆外南侧甬道）：
                      ┌───────────────────┐
                      │  第四单元 · 感知   │
         ┌────────────┤   内厅（第二单元） ├───────────┐
         │ 第一单元    ├─────────┬──────────┤           │
         │ 色源·万物生 │ 八角主厅（第三单元）│           │
         └────────────┤        ◉           ├───────────┘
                      ├─────────┴──────────┤
                      │    序厅（入口）     │
                      └──────────┬─────────┘
                            ● 甬道 · 起点
   ============================================================ */

function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
/* canvas 没有自动换行：中文按字符贪心断行 */
function wrapCJK(ctx, text, maxW) {
  const out = [];
  for (const raw of String(text).split('\n')) {
    if (!raw.trim()) { out.push(''); continue; }
    let line = '';
    for (const ch of raw) {
      if (line && ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  }
  return out;
}
/* 展板：标题 + 正文 */
function textBoardTex(o) {
  const { w = 1024, h = 640, bg = '#efe6d2', fg = '#2f2a1e', title = '', sub = '',
          body = '', titleSize = 56, bodySize = 29, align = 'left' } = o;
  return canvasTex(w, h, (ctx, W, H) => {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(90,75,45,0.45)'; ctx.lineWidth = 4; ctx.strokeRect(16, 16, W-32, H-32);
    ctx.fillStyle = fg;
    ctx.textAlign = align === 'center' ? 'center' : 'left';
    const x0 = align === 'center' ? W/2 : 56;
    let y = 0;
    if (title) {
      ctx.font = `bold ${titleSize}px ${CJK}`;
      y = titleSize + 42;
      ctx.fillText(title, x0, y);
      y += 18;
      if (sub) {
        ctx.font = `${Math.round(titleSize*0.34)}px monospace`;
        ctx.globalAlpha = 0.6; ctx.fillText(sub, x0, y + 6); ctx.globalAlpha = 1;
        y += 26;
      }
      ctx.strokeStyle = 'rgba(90,75,45,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(56, y + 12); ctx.lineTo(W - 56, y + 12); ctx.stroke();
      y += 34;
    }
    if (body) {
      ctx.font = `${bodySize}px ${CJK}`;
      const lh = Math.round(bodySize * 1.85);
      wrapCJK(ctx, body, W - 112).forEach(ln => { y += lh; ctx.fillText(ln, x0, y); });
    }
  });
}
/* 门楣/标题带：深底金字，字号自适应 */
function bandTex(title, sub, W = 1024, H = 220) {
  return canvasTex(W, H, (ctx, w, h) => {
    ctx.fillStyle = '#2a241b'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(232,207,148,0.5)'; ctx.lineWidth = 5; ctx.strokeRect(12, 12, w-24, h-24);
    ctx.fillStyle = '#e8cf94'; ctx.textAlign = 'center';
    let fs = 84;
    ctx.font = `bold ${fs}px ${CJK}`;
    while (ctx.measureText(title).width > w - 80 && fs > 22) {
      fs -= 4; ctx.font = `bold ${fs}px ${CJK}`;
    }
    ctx.fillText(title, w/2, sub ? 118 : h/2 + fs*0.35);
    if (sub) {
      ctx.font = '26px monospace'; ctx.fillStyle = 'rgba(232,207,148,0.6)';
      ctx.fillText(sub, w/2, 172);
    }
  });
}
function plate(tex, pw, ph, x, y, z, rotY = 0, rotX = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph),
    new THREE.MeshBasicMaterial({ map: tex }));
  m.position.set(x, y, z); m.rotation.y = rotY; m.rotation.x = rotX;
  scene.add(m);
  return m;
}

/* ---------- 展厅壳体 ---------- */
function buildWallSide(dir, cx, cz, w, d, h, mat, doors) {
  const isX = (dir === '+z' || dir === '-z');
  const fixedAt = dir === '+z' ? cz + d/2 : dir === '-z' ? cz - d/2
                : dir === '+x' ? cx + w/2 : cx - w/2;
  const center = isX ? cx : cz, len = isX ? w : d;
  const holes = doors.filter(o => o.side === dir).map(o => [o.at - o.half, o.at + o.half]);
  const g = new THREE.Group();
  solidSpans(center - len/2, center + len/2, holes).forEach(([a, b]) => {
    const m = new THREE.Mesh(
      isX ? new THREE.BoxGeometry(b - a, h, WALL_T) : new THREE.BoxGeometry(WALL_T, h, b - a), mat);
    m.position.set(isX ? (a + b)/2 : fixedAt, h/2, isX ? fixedAt : (a + b)/2);
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  });
  doors.filter(o => o.side === dir).forEach(o => {
    const top = o.top || 3.1, ph = h - top;
    if (ph <= 0.01) return;
    const m = new THREE.Mesh(
      isX ? new THREE.BoxGeometry(o.half*2, ph, WALL_T) : new THREE.BoxGeometry(WALL_T, ph, o.half*2), mat);
    m.position.set(isX ? o.at : fixedAt, (h + top)/2, isX ? fixedAt : o.at);
    g.add(m);
  });
  return g;
}
function buildRoom(o) {
  const { cx, cz, w, d, h = WALL_H, doors = [], omit = [], wall = WALL_C,
          floor = FLOOR_C, ceil = CEIL_C, lamp = true, roof = true } = o;
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: wall, roughness: 0.94 });
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ color: floor, roughness: 0.82 }));
  fl.rotation.x = -Math.PI/2; fl.position.set(cx, 0.004, cz); fl.receiveShadow = true;
  g.add(fl);
  const ce = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ color: ceil, roughness: 0.96 }));
  ce.rotation.x = Math.PI/2; ce.position.set(cx, h, cz);
  g.add(ce);
  ['+z', '-z', '+x', '-x'].forEach(dir => {
    if (omit.indexOf(dir) >= 0) return;
    g.add(buildWallSide(dir, cx, cz, w, d, h, mat, doors));
  });
  if (roof) {
    const rf = new THREE.Mesh(new THREE.BoxGeometry(w + 0.9, 0.36, d + 0.9),
      new THREE.MeshStandardMaterial({ color: ROOF_COLOR, roughness: 0.9 }));
    /* ⚠️ 位置必须 h+0.26，别改回 h+0.18。屋顶盒高 0.36，取 h+0.18 时其底面正好压在
       天花板平面 y=h 上 —— 两面共面 → z-fighting，表现为「移动时天花板（灯那一圈）
       忽明忽暗地闪」。抬 8cm 同时躲开两处共面：
         · 天花板平面 y=h                                  → 底面上移到 h+0.08
         · 八角屋顶 roof8（y 4.64~5.00，平面上与各厅屋面有重叠）→ 顶面 5.04 错开 4cm */
    rf.position.set(cx, h + 0.26, cz);
    g.add(rf);
  }
  if (lamp) {
    const l = new THREE.PointLight('#ffe9c6', 18, Math.max(w, d) * 1.7, 2);
    l.position.set(cx, h - 0.8, cz);
    g.add(l);
  }
  scene.add(g);
  return g;
}
/* 门套：包住墙洞，同时遮住八边形墙板被切开的断面 */
function buildPortal(x, z, half, top, h, depth) {
  const g = new THREE.Group();
  const jw = 0.5;
  [-1, 1].forEach(s => {
    const j = new THREE.Mesh(new THREE.BoxGeometry(jw, top, depth), WOOD_MAT);
    j.position.set(x + s * (half + jw/2), top/2, z);
    j.castShadow = j.receiveShadow = true;
    g.add(j);
  });
  const l = new THREE.Mesh(new THREE.BoxGeometry(half*2 + jw*2, h - top + 0.02, depth), WOOD_MAT);
  l.position.set(x, (h + top)/2, z);
  g.add(l);
  scene.add(g);
  return g;
}
/* 低斜展牌：短立柱 + 明显后仰的板面（阅览台式，板顶约 0.98m）。
   ⚠️ **板顶必须低于视高**（眼睛 y≈1.70）—— 这是「展牌不挡身后画作」的硬条件：
      板顶高于视高时，它在屏幕上一定盖住画心，**把它挪近画、挪远、挪到一边都没用**。
      2026-10-13 由「板顶 1.96m 的立式大牌」改成本型，配合画心上移，见内厅那一段的算式。 */
const BOARD_TILT = 0.42;    // 板面后仰角（弧度）≈24°，正对 1.7m 视高在 2m 外的俯视角
const BOARD_POST_H = 0.45;  // 立柱高
const BOARD_Y0 = 0.43;      // 板面**下沿**高度（与柱顶齐）
function buildStandBoard(tex, bw, bh, x, z, rotY) {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, BOARD_POST_H, 0.1),
    new THREE.MeshStandardMaterial({ color:'#4b4237', roughness:0.7 }));
  post.position.set(0, BOARD_POST_H/2, 0); post.castShadow = true;
  g.add(post);
  const b = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh),
    new THREE.MeshBasicMaterial({ map: tex }));
  b.position.set(0, BOARD_Y0 + bh/2 * Math.cos(BOARD_TILT), 0.04);
  b.rotation.x = -BOARD_TILT;
  g.add(b);
  g.position.set(x, 0, z);
  if (rotY) g.rotation.y = rotY;
  scene.add(g);
  return g;
}
/* 板顶 = BOARD_Y0 + bh·cos(BOARD_TILT)。内厅用 bh=0.60 → 0.43+0.548 = **0.98m**。
   改上面三个常量或调用处的 bh，都要回头核对这个数仍 < 1.26（1.7m 视高、大厅最远视角的临界值）。 */

/* ============================================================================
   第一单元 · 矿物颜料展厅（2026-10-12 第 21 轮）
   地平矮展柜 + 原石‑碎料‑色卡 三层陈列 + 专用托具 + 规范矿物铭牌。
   照明是 3000‑4000K 中性白、斜侧掠射；**不用彩光、不加发光特效**。
   ============================================================================ */

/* ---------- 1. 定种子伪随机 ----------
   程序化矿石必须每次刷新长得一模一样 —— 一律不能用 Math.random()。 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 2. 矿斑贴图 ----------
   ⚠️ map(sRGB) 与 roughnessMap(NoColorSpace) 必须**各画一张** canvas。
   r152+ 起 three 按 texture.source 共享 WebGLTexture，把同一张图同时挂在 map 与
   roughnessMap 上，两种 colorSpace 会互相覆盖（第 19 轮 motifMat 踩过，见 HANDOFF §8）。 */
const SPECK_CACHE = {};
function speckMaps(hex, seed) {
  if (SPECK_CACHE[hex]) return SPECK_CACHE[hex];
  const rnd = mulberry32(seed);
  const blobs = [], dots = [];
  for (let i = 0; i < 26; i++)
    blobs.push({ x: rnd(), y: rnd(), r: 0.05 + rnd() * 0.22, up: rnd() > 0.5, a: 0.05 + rnd() * 0.16 });
  for (let i = 0; i < 460; i++)
    dots.push({ x: rnd(), y: rnd(), s: 0.7 + rnd() * 1.8, up: rnd() > 0.5 });
  const paint = colored => canvasTex(256, 256, (ctx, W, H) => {
    ctx.fillStyle = colored ? hex : '#cfcfcf';
    ctx.fillRect(0, 0, W, H);
    for (const b of blobs) {
      ctx.fillStyle = (b.up ? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (colored ? b.a : b.a * 1.8) + ')';
      ctx.beginPath(); ctx.arc(b.x * W, b.y * H, b.r * W, 0, Math.PI * 2); ctx.fill();
    }
    for (const d of dots) {
      ctx.fillStyle = d.up ? 'rgba(255,255,255,0.20)' : 'rgba(0,0,0,0.20)';
      ctx.fillRect(d.x * W, d.y * H, d.s, d.s);
    }
  });
  const map = paint(true);
  const rough = paint(false); rough.colorSpace = THREE.NoColorSpace;
  SPECK_CACHE[hex] = { map, rough };
  return SPECK_CACHE[hex];
}

/* 标本材质：map 已经带上本色，所以 color 一律给白 —— 若同时给 hex，
   两者会相乘把颜色压暗一档。釉瓷片走 clearcoat 釉面，矿石/料走 flatShading 晶面。 */
const SPEC_MAT_CACHE = {};
function specimenMat(hex, seed, glazed) {
  const k = hex + (glazed ? '|g' : '');
  if (SPEC_MAT_CACHE[k]) return SPEC_MAT_CACHE[k];
  const { map, rough } = speckMaps(hex, seed);
  SPEC_MAT_CACHE[k] = glazed
    ? new THREE.MeshPhysicalMaterial({ map, roughnessMap: rough, color: '#ffffff',
        roughness: 0.16, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05,
        side: THREE.DoubleSide, envMap: ENV_TEX, envMapIntensity: 0.45 })
    : new THREE.MeshStandardMaterial({ map, roughnessMap: rough, color: '#ffffff',
        roughness: 0.80, metalness: 0.05, flatShading: true });
  return SPEC_MAT_CACHE[k];
}
/* 干=干料本色。植物干料**不**用颜料色 —— 真实的苏木是暗红木、槐米是橄榄褐、
   磨出来才有色。这条颜色反差正是「水色」那一层要讲的事：
   ①② 层是干料本色，③ 层才是研出的色粉与染绢。 */
const DRIED_HEX = { bud:'#8a7a4a', fruit:'#a86a34', chip:'#7a3a30', bundle:'#5f7358' };
const driedMat = (form, seed) => specimenMat(DRIED_HEX[form] || '#8a7a4a', seed, false);

/* ---------- 3. 形制 ----------
   矿石：先归一化到单位球，再按**坐标 + 种子**位移 —— 同一位置的重复顶点算出同一个位移，
   所以面不会被撕开；位移只由 seed 决定，刷新页面形状不变。 */
function roughRock(r, seed, jag, detail) {
  const g = new THREE.IcosahedronGeometry(1, detail === undefined ? 1 : detail);
  const p = g.attributes.position, v = new THREE.Vector3(), s = seed * 0.618;
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    const n = 0.62 * Math.sin(v.x * 2.3 + s) * Math.cos(v.y * 1.9 - s * 0.8)
                    * Math.sin(v.z * 2.7 + s * 1.4)
            + 0.38 * (Math.sin(v.x * 5.1 - s) + Math.cos(v.y * 4.7 + s)
                    + Math.sin(v.z * 5.3 - s * 2.1)) / 3;
    v.multiplyScalar(r * (1 + jag * n));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
/* 把几何体「坐」到 y=0：位移过的矿石包围盒不再是 ±r，直接用实测最低点落位，
   否则要么陷进台阶、要么浮在半空（两者在这个尺度下都一眼能看出来）。 */
function seatOnY0(mesh, baseY) {
  mesh.geometry.computeBoundingBox();
  mesh.position.y = baseY - mesh.geometry.boundingBox.min.y;
}
/* 植物料 / 树脂料：一小撮细条，按种子散开 */
function dyePile(r, seed, mat) {
  const g = new THREE.Group(), rnd = mulberry32(seed * 7 + 3);
  for (let i = 0; i < 12; i++) {
    const a = rnd() * Math.PI * 2, rr = r * (0.08 + rnd() * 0.74);
    const m = new THREE.Mesh(
      new THREE.CylinderGeometry(r * 0.05, r * 0.072, r * (0.42 + rnd() * 0.52), 6), mat);
    m.position.set(Math.cos(a) * rr, r * 0.12 + rnd() * r * 0.18, Math.sin(a) * rr);
    m.rotation.set(Math.PI / 2 - (rnd() - 0.5) * 0.6, rnd() * Math.PI, (rnd() - 0.5) * 0.8);
    m.castShadow = true;
    g.add(m);
  }
  return liftToY0(g);        /* 料条随机翻滚，最低点可能扎进台阶里 —— 按实测包围盒抬起 */
}
/* 色粉堆：半球压扁 */
function pigmentMound(r, mat) {
  const g = new THREE.SphereGeometry(r, 18, 9, 0, Math.PI * 2, 0, Math.PI / 2);
  g.scale(1, 0.55, 1); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}
/* 随机翻滚/堆叠的一组小件，最低点常常穿出台面 —— 按实测包围盒整组抬到 y=0。
   dyePile 那三行抽成公共函数，植物干料 4 个构造器都要用。 */
function liftToY0(g) {
  g.updateMatrixWorld(true);
  g.position.y -= new THREE.Box3().setFromObject(g).min.y;
  return g;
}
/* ---------- 3.5 植物干料（水色专用，与「矿石原石」并列的另一半）----------
   文档要求植物展品陈列「栀子、槐米、苏木干料」—— 干料就是能一眼认出来的原植物，
   不是矿石。全部基本体、全部定种子。 */
/* 槐米：一根细枝上密生小球（未开的槐花蕾） */
function budCluster(r, seed, mat) {
  const g = new THREE.Group(), rnd = mulberry32(seed * 5 + 17);
  const twig = new THREE.Mesh(
    new THREE.CylinderGeometry(r * 0.055, r * 0.085, r * 1.5, 6),
    new THREE.MeshStandardMaterial({ color: '#6d5a3c', roughness: 0.9 }));
  twig.position.y = r * 0.75; twig.rotation.z = 0.16; twig.castShadow = true;
  g.add(twig);
  for (let i = 0; i < 38; i++) {
    const t = rnd(), a = rnd() * Math.PI * 2;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r * (0.13 + rnd() * 0.05), 8, 6), mat);
    b.position.set(twig.rotation.z * -r * 1.5 * t + Math.cos(a) * r * (0.20 + rnd() * 0.26),
                   r * (0.18 + t * 1.34),
                   Math.sin(a) * r * (0.20 + rnd() * 0.26));
    b.castShadow = true;
    g.add(b);
  }
  return liftToY0(g);
}
/* 栀子：6~8 枚带棱的椭球果，散堆 */
function fruitPods(r, seed, mat) {
  const g = new THREE.Group(), rnd = mulberry32(seed * 9 + 5);
  const n = 6 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rnd() * 0.5, rr = r * (0.10 + rnd() * 0.46);
    const f = new THREE.Mesh(new THREE.SphereGeometry(r * (0.24 + rnd() * 0.09), 12, 9), mat);
    f.scale.set(1, 0.74 + rnd() * 0.14, 1);
    f.position.set(Math.cos(a) * rr, r * (0.22 + rnd() * 0.16), Math.sin(a) * rr);
    f.rotation.set((rnd() - 0.5) * 1.2, rnd() * Math.PI, (rnd() - 0.5) * 1.2);
    f.castShadow = true;
    g.add(f);
  }
  return liftToY0(g);
}
/* 苏木：20 片薄木屑乱堆 + 边上一点胭脂碎料（文档：苏木 + 胭脂） */
function woodChips(r, seed, mat) {
  const g = new THREE.Group(), rnd = mulberry32(seed * 11 + 29);
  for (let i = 0; i < 20; i++) {
    const a = rnd() * Math.PI * 2, rr = r * (0.06 + rnd() * 0.72);
    const c = new THREE.Mesh(
      new THREE.BoxGeometry(r * (0.30 + rnd() * 0.34), r * 0.045, r * (0.14 + rnd() * 0.16)), mat);
    c.position.set(Math.cos(a) * rr, r * (0.06 + rnd() * 0.34), Math.sin(a) * rr);
    c.rotation.set((rnd() - 0.5) * 1.5, rnd() * Math.PI, (rnd() - 0.5) * 1.5);
    c.castShadow = true;
    g.add(c);
  }
  /* 胭脂：虫料，颜色比苏木更艳 —— 单独一小撮，摆在旁边 */
  const coch = dyePile(r * 0.34, seed + 3,
    new THREE.MeshStandardMaterial({ color: '#c0344f', roughness: 0.72, flatShading: true }));
  coch.position.set(r * 0.72, 0, r * 0.52);
  g.add(coch);
  return liftToY0(g);
}
/* 蓼蓝：一束带叶的茎（月白是蓼蓝调浅得来的复合色，属于植物系） */
function bundle(r, seed, mat) {
  const g = new THREE.Group(), rnd = mulberry32(seed * 13 + 7);
  for (let i = 0; i < 11; i++) {
    const a = (i / 11) * Math.PI * 2, rr = r * 0.11;
    const st = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.030, r * 0.042, r * 1.15, 6), mat);
    st.position.set(Math.cos(a) * rr, r * 0.58, Math.sin(a) * rr);
    st.rotation.set((rnd() - 0.5) * 0.34, 0, (rnd() - 0.5) * 0.34);
    st.castShadow = true;
    g.add(st);
  }
  for (let i = 0; i < 14; i++) {
    const a = rnd() * Math.PI * 2, rr = r * (0.14 + rnd() * 0.30);
    const lf = new THREE.Mesh(new THREE.SphereGeometry(r * (0.15 + rnd() * 0.08), 7, 5), mat);
    lf.scale.set(1, 0.30, 1.9);
    lf.position.set(Math.cos(a) * rr, r * (0.10 + rnd() * 0.72), Math.sin(a) * rr);
    lf.rotation.set(0, rnd() * Math.PI, (rnd() - 0.5) * 0.5);
    lf.castShadow = true;
    g.add(lf);
  }
  return liftToY0(g);
}
/* 染色绢小样：水色的真实呈色更接近染绢而不是色粉 —— 石色/水色一眼可辨的差别 */
function silkSwatch(c) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.052, 0.052),
    new THREE.MeshStandardMaterial({ color: c.hex, roughness: 0.88, side: THREE.DoubleSide }));
  m.rotation.x = -1.32;                                  // 几乎平铺，微微翘起一角
  m.position.y = 0.004;
  m.castShadow = true;
  const lip = new THREE.Mesh(new THREE.PlaneGeometry(0.052, 0.016),
    new THREE.MeshStandardMaterial({ color: c.hex, roughness: 0.88, side: THREE.DoubleSide }));
  lip.rotation.x = -0.62;
  lip.position.set(0, 0.010, 0.030);
  g.add(m, lip);
  return g;
}
/* 把 hex 往白里调 k 倍 —— 沉淀分级的三阶色用它（同一色相，越漂越浅） */
function tint(hex, k) {
  const c = new THREE.Color(hex);
  c.lerp(new THREE.Color('#ffffff'), k);
  return '#' + c.getHexString();
}

/* ---------- 4. 专用托具（原石 / 碎料 / 色卡 各一种）---------- */
/* 亚克力三爪托架：三根细杆向轴心倾，环住矿石腰；透明所以「看不见」，是真实博物馆的常规做法 */
function oreMount(gripR) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(gripR * 1.30, gripR * 1.30, 0.010, 28), ACRYLIC_MAT);
  base.position.y = 0.005;
  g.add(base);
  const h = gripR * 1.05;
  for (let i = 0; i < 3; i++) {
    const hold = new THREE.Group();
    hold.rotation.y = -(i / 3 * Math.PI * 2 + 0.5);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, h, 8), ACRYLIC_MAT);
    rod.position.set(gripR * 0.94, 0.012 + h * 0.46, 0);
    rod.rotation.z = 0.30;                       // 顶端向轴心倾 → 夹住矿石
    hold.add(rod);
    g.add(hold);
  }
  return g;
}
/* 白瓷浅碟：碎料 / 色粉共用 */
function shallowDish(r, h, mat) {
  const g = new THREE.Group();
  const d = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.86, h, 28), mat);
  d.position.y = h / 2; d.castShadow = true; d.receiveShadow = true;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r, h * 0.16, 8, 28), mat);
  rim.rotation.x = Math.PI / 2; rim.position.y = h;
  g.add(d, rim);
  return g;
}
/* 色卡（成品颜料）：色块 + 色名 + 色值，斜置在小黄铜卡托上 */
function colorCard(c, min) {
  const g = new THREE.Group();
  const tex = canvasTex(256, 176, (ctx, W, H) => {
    ctx.fillStyle = '#f3ecdd'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(92,78,50,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(6, 6, W - 12, H - 12);
    ctx.fillStyle = c.hex; ctx.fillRect(18, 18, 94, 140);
    ctx.strokeStyle = 'rgba(60,50,32,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(18, 18, 94, 140);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#241f16'; ctx.font = `bold 48px ${CJK}`;
    ctx.fillText(c.name, 126, 76);
    ctx.fillStyle = '#6d6148';
    ctx.font = '22px ui-monospace,Consolas,monospace';
    ctx.fillText(c.hex.toUpperCase(), 128, 108);
    ctx.font = `22px ${CJK}`;
    ctx.fillText('颜料 · ' + min.pigment, 128, 142);
  });
  const board = new THREE.Group();
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.115, 0.082, 0.005), BRASS_MAT);
  back.position.z = -0.004;
  const card = new THREE.Mesh(new THREE.PlaneGeometry(0.105, 0.072),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78 }));
  card.castShadow = back.castShadow = true;
  board.add(back, card);
  board.rotation.x = -0.38;                       // 后仰 22°，正对俯视视线
  board.position.y = 0.045;
  g.add(board);
  [-1, 1].forEach(s => {
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.044, 0.030), BRASS_MAT);
    foot.position.set(s * 0.048, 0.022, -0.006);
    g.add(foot);
  });
  return g;
}

/* ---------- 5. 规范标本铭牌 ----------
   格式照博物馆标签：中文名 + 英名 / 原料名 / 成分 / 产地 / 颜料名 + 编号。
   ⚠️ 倾角是算出来的：早先取 0.52rad（离竖直 30°）立在前檐，顶边到 y≈0.895、z≈0.305，
   而它正后方的色卡层顶边只到 y≈0.829、z≈0.193 —— 铭牌比被它挡住的东西还高 6.6cm、
   又在前 11cm，必然切进俯视视线（用户实测反馈）。
   现在放平到 1.20rad（离竖直 69°），竖直投影只剩 0.16·cos(1.2)=0.058m，顶边 y≈0.808，
   **低于**色卡顶边 —— 视线先越过铭牌再落到标本上。真实平柜的标签也正是这样几乎平铺的。 */
const LABEL_W = 0.26, LABEL_H = 0.16, LABEL_TILT = 1.20;
function mineralLabel(min, c, no) {
  const g = new THREE.Group();
  const tex = canvasTex(520, 320, (ctx, W, H) => {
    ctx.fillStyle = '#f3ecdd'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(92,78,50,0.55)'; ctx.lineWidth = 3; ctx.strokeRect(8, 8, W - 16, H - 16);
    ctx.strokeStyle = 'rgba(92,78,50,0.22)'; ctx.lineWidth = 1; ctx.strokeRect(15, 15, W - 30, H - 30);
    ctx.fillStyle = c.hex; ctx.fillRect(26, 26, 54, 54);
    ctx.strokeStyle = 'rgba(60,50,32,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(26, 26, 54, 54);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left'; ctx.fillStyle = '#241f16';
    ctx.font = `bold 50px ${CJK}`; ctx.fillText(c.name, 96, 70);
    ctx.textAlign = 'right'; ctx.fillStyle = '#8a7c5e';
    ctx.font = '24px ui-monospace,Consolas,monospace'; ctx.fillText(min.en, W - 26, 62);
    ctx.strokeStyle = 'rgba(92,78,50,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(26, 96); ctx.lineTo(W - 26, 96); ctx.stroke();
    /* 石色问「什么矿物」，水色问「什么草木」——两类的字段名不一样 */
    ctx.textAlign = 'left';
    ctx.fillStyle = '#3a3226'; ctx.font = `30px ${CJK}`;
    ctx.fillText((IS_STONE(min) ? '矿物　' : '原料　') + min.mat, 26, 140);
    ctx.fillStyle = '#6d6148'; ctx.font = '24px ui-monospace,Consolas,monospace';
    ctx.fillText(min.comp, 26, 182);
    ctx.fillStyle = '#3a3226'; ctx.font = `26px ${CJK}`;
    ctx.fillText('产地　' + min.origin, 26, 232);
    ctx.fillText('颜料　' + min.pigment, 26, 274);
    ctx.textAlign = 'right'; ctx.fillStyle = '#6d6148';
    ctx.font = '24px ui-monospace,Consolas,monospace';
    ctx.fillText('NO.' + no, W - 26, 274);
  });
  const board = new THREE.Group();
  const back = new THREE.Mesh(
    new THREE.BoxGeometry(LABEL_W + 0.014, LABEL_H + 0.014, 0.006), BRASS_MAT);
  back.position.z = -0.004;
  const card = new THREE.Mesh(new THREE.PlaneGeometry(LABEL_W, LABEL_H),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.76 }));
  card.castShadow = back.castShadow = true;
  board.add(back, card);
  board.rotation.x = -LABEL_TILT;                       // 顶边后倒
  board.position.y = LABEL_H * Math.cos(LABEL_TILT) / 2 + 0.006;
  g.add(board);
  return g;
}

/* ---------- 6. 地平矮展柜 ----------
   本地坐标：X = 柜宽（1.50）、Z = 进深（0.92）、+Z 朝观众。
   三层台阶自前向后抬高：色卡（台面）→ 碎料 → 原石，后排不遮挡前排。 */
const CASE_W = 1.50, CASE_D = 0.92;
const DECK_Y = 0.75, BONNET_H = 0.42;                  // 罩顶 1.17m：站着俯视 40°~50°
const TIER_Y = [0.75, 0.83, 0.91];                     // 色卡 / 碎料 / 原石
const TIER_Z = [0.13, -0.09, -0.32];
const TIER_D = [0.22, 0.22, 0.24];
const BAY_X  = [-0.36, 0.36];                          // 两个标本位的中心
const SILL_Z = 0.33;                                   // 铭牌前檐（平铺，footprint 0.256…0.404，在玻璃 0.44 内）

function caseNameplate(title, sub) {
  const g = new THREE.Group();
  const tex = canvasTex(1024, 168, (ctx, W, H) => {
    ctx.fillStyle = '#f3ecdd'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(92,78,50,0.5)'; ctx.lineWidth = 3; ctx.strokeRect(8, 8, W - 16, H - 16);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left'; ctx.fillStyle = '#241f16';
    ctx.font = `bold 74px ${CJK}`; ctx.fillText(title, 38, 108);
    ctx.textAlign = 'right'; ctx.fillStyle = '#7d6f52';
    ctx.font = `34px ${CJK}`; ctx.fillText(sub, W - 38, 104);
  });
  const board = new THREE.Group();
  const back = new THREE.Mesh(new THREE.BoxGeometry(1.32, 0.233, 0.012), BRASS_MAT);
  back.position.z = -0.007;
  const card = new THREE.Mesh(new THREE.PlaneGeometry(1.30, 0.213),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.76 }));
  card.castShadow = back.castShadow = true;
  board.add(back, card);
  board.rotation.x = -0.26;                            // 上仰 15°
  board.position.set(0, 0.60, CASE_D / 2 + 0.03);
  g.add(board);
  return g;
}

/* 一个标本位：① 原石/干料 → ② 矿粒/粗碎料 → ③ 色粉(+染绢) 三层 + 托具 + 罩内铭牌
   石色与植物水色的区别就在这三层的内容上（用户文档的两条硬要求）。 */
function specimenBay(min, bx, no) {
  const g = new THREE.Group(), c = COLOR_BY_ID[min.cid], seed = 1000 + no * 37;
  const stone = IS_STONE(min);
  const mat = specimenMat(c.hex, seed, false);
  const matRaw = stone ? mat : driedMat(min.form, seed);   // 石色①②③同色；水色①②用干料本色
  /* ① 原石 / 干料层：矿石用三爪托架托着；干料是松散的一堆，直接坐在台面上 */
  const rockG = new THREE.Group();
  let top;
  if (stone) {
    rockG.add(oreMount(0.085));
    top = new THREE.Mesh(roughRock(0.082, seed, 0.30, 1), matRaw);
    seatOnY0(top, 0.010);                              // 实测最低点落在托座面上
  } else {
    /* 干料构造器返回的都是已把最低点归零到 y=0 的 Group，直接坐在台面上 */
    top = { bud   : () => budCluster(0.090, seed, matRaw),
            fruit : () => fruitPods(0.088, seed, matRaw),
            chip  : () => woodChips(0.090, seed, matRaw),
            bundle: () => bundle(0.092, seed, matRaw) }[min.form]();
    top.position.y += 0.008;
  }
  top.castShadow = true;
  rockG.add(top);
  rockG.position.set(bx, TIER_Y[2], TIER_Z[2]);
  g.add(rockG);
  /* ② 矿粒 / 粗碎料层：白瓷浅碟里一小堆同色碎块 */
  const frag = new THREE.Group();
  frag.add(shallowDish(0.082, 0.030, PORCELAIN_MAT));
  const rnd = mulberry32(seed * 3 + 11);
  for (let i = 0; i < 6; i++) {
    const a = rnd() * Math.PI * 2, rr = 0.018 + rnd() * 0.032;
    const f = new THREE.Mesh(roughRock(0.011 + rnd() * 0.010, seed + i * 5, 0.42, 0), matRaw);
    f.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr);
    seatOnY0(f, 0.028);                                // 碟口高 0.03，碎块坐面上略陷 2mm
    f.castShadow = true;
    frag.add(f);
  }
  frag.position.set(bx, TIER_Y[1], TIER_Z[1]);
  g.add(frag);
  /* ③ 色粉层：浅碟色粉堆 + 斜置色卡（水色另加一方染色绢 —— 水色的真实呈色是染在绢上的） */
  const card = new THREE.Group();
  const dish = shallowDish(0.052, 0.018, PORCELAIN_MAT);
  dish.position.set(0, 0, -0.015);
  const mound = pigmentMound(0.042, mat);
  mound.position.set(0, 0.018, -0.015);                // 碟口高 0.018：色粉堆坐在碟面上
  const cc = colorCard(c, min);
  cc.position.set(0, 0, 0.078);
  card.add(dish, mound, cc);
  if (!stone) {
    const sw = silkSwatch(c);
    sw.position.set(-0.115, 0.002, 0.052);
    card.add(sw);
  }
  card.position.set(bx, TIER_Y[0], 0.115);
  g.add(card);
  /* ④ 罩内规范铭牌 */
  const lab = mineralLabel(min, c, String(no).padStart(2, '0'));
  lab.position.set(bx, DECK_Y, SILL_Z);
  g.add(lab);
  /* ⑤ 斜侧白光：灯装在罩内前外侧，从前上角掠过三层台 —— 靠明暗关系出矿物的晶面与颗粒感 */
  const sp = new THREE.SpotLight('#ffeedd', 1.8, 3.2, 0.55, 0.7, 2);
  sp.position.set(bx + (bx < 0 ? -0.26 : 0.26), 1.10, 0.30);
  sp.target.position.set(bx, 0.84, -0.02);
  sp.castShadow = false;
  g.add(sp, sp.target);
  return g;
}

function buildTableCase(title, sub, minA, minB) {
  const g = new THREE.Group();
  /* 踢脚（四周内缩）+ 柜体 + 出檐台面 */
  const kick = new THREE.Mesh(new THREE.BoxGeometry(CASE_W - 0.10, 0.07, CASE_D - 0.10), WOOD_MAT);
  kick.position.y = 0.035; kick.castShadow = kick.receiveShadow = true; g.add(kick);
  const body = new THREE.Mesh(new THREE.BoxGeometry(CASE_W, 0.65, CASE_D), CASE_BODY_MAT);
  body.position.y = 0.395; body.castShadow = body.receiveShadow = true; g.add(body);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(CASE_W + 0.02, 0.03, CASE_D + 0.02), CASE_FELT_MAT);
  deck.position.y = DECK_Y - 0.015; deck.castShadow = deck.receiveShadow = true; g.add(deck);
  /* 罩内两层台阶（色卡层就是台面本身） */
  for (let t = 1; t < 3; t++) {
    const h = TIER_Y[t] - DECK_Y;
    const step = new THREE.Mesh(new THREE.BoxGeometry(CASE_W - 0.06, h, TIER_D[t]), CASE_STEP_MAT);
    step.position.set(0, DECK_Y + h / 2, TIER_Z[t]);
    step.castShadow = step.receiveShadow = true;
    g.add(step);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(CASE_W - 0.06, 0.008, TIER_D[t]), CASE_FELT_MAT);
    cap.position.set(0, TIER_Y[t] - 0.004, TIER_Z[t]);
    g.add(cap);
  }
  /* 两个标本位 */
  g.add(specimenBay(minA, BAY_X[0], 1), specimenBay(minB, BAY_X[1], 2));
  /* 玻璃罩：四面墙 + 平顶，比台面缩进 1cm */
  const halfW = CASE_W / 2, halfD = CASE_D / 2 - 0.01;
  [[CASE_W, 0, halfD, 0], [CASE_W, 0, -halfD, 0],
   [CASE_D - 0.02, halfW, 0, Math.PI / 2], [CASE_D - 0.02, -halfW, 0, Math.PI / 2]]
    .forEach(([gw, px, pz, ry]) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(gw, BONNET_H), CASE_GLASS);
      m.position.set(px, DECK_Y + BONNET_H / 2, pz);
      m.rotation.y = ry;
      g.add(m);
    });
  const lid = new THREE.Mesh(new THREE.PlaneGeometry(CASE_W, CASE_D - 0.02), CASE_GLASS);
  lid.rotation.x = -Math.PI / 2; lid.position.y = DECK_Y + BONNET_H;
  g.add(lid);
  /* 罩体边框：底衬条 + 四角立柱 */
  const bar = (w, d, px, pz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.024, d), CASE_FRAME_MAT);
    m.position.set(px, DECK_Y + 0.012, pz); m.castShadow = true; g.add(m);
  };
  bar(CASE_W, 0.024, 0, halfD); bar(CASE_W, 0.024, 0, -halfD);
  bar(0.024, CASE_D - 0.02, halfW, 0); bar(0.024, CASE_D - 0.02, -halfW, 0);
  [[halfW, halfD], [halfW, -halfD], [-halfW, halfD], [-halfW, -halfD]].forEach(([px, pz]) => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.024, BONNET_H, 0.024), CASE_FRAME_MAT);
    p.position.set(px, DECK_Y + BONNET_H / 2, pz); p.castShadow = true; g.add(p);
  });
  g.add(caseNameplate(title, sub));
  return g;
}

/* ---------- 6.5 工序台（北墙）：把「加工流程」做成看得见摸得着的实物 ----------
   四座木台，台面 0.78m（与平柜同高，站着看不用弯腰），沿北墙一字排开：
     ① 粉碎 → 石臼与杵   ② 水飞 → 陶盆漂洗
     ③ 沉淀 → 三只玻璃小缸（同一色相的头青/二青/三青）  ④ 晾干 → 竹匾 + 8 色色粉
   台前缘各平放一块小铭牌。全部无彩光、无发光。 */
const BENCH_H = 0.78, BENCH_W = 0.58;
function benchLabel(no, title, sub) {
  const g = new THREE.Group();
  const tex = canvasTex(520, 200, (ctx, W, H) => {
    ctx.fillStyle = '#f3ecdd'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(92,78,50,0.55)'; ctx.lineWidth = 3; ctx.strokeRect(8, 8, W - 16, H - 16);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7d6f52'; ctx.textAlign = 'left';
    ctx.font = '26px ui-monospace,Consolas,monospace'; ctx.fillText('STEP ' + no, 26, 46);
    ctx.fillStyle = '#241f16'; ctx.font = `bold 46px ${CJK}`; ctx.fillText(title, 26, 108);
    ctx.fillStyle = '#5a5040'; ctx.font = `24px ${CJK}`; ctx.fillText(sub, 26, 158);
  });
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.116, 0.006), BRASS_MAT);
  back.position.z = -0.004;
  const card = new THREE.Mesh(new THREE.PlaneGeometry(0.29, 0.108),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.76 }));
  card.castShadow = back.castShadow = true;
  const board = new THREE.Group();
  board.add(back, card);
  board.rotation.x = -1.16;                              // 与罩内铭牌同法：平铺，不挡东西
  board.position.set(0, 0.030, 0.235);
  g.add(board);
  return g;
}
/* ① 石臼 + 杵：捣碎矿石。臼口里放几块原矿，杵斜倚在沿上 */
function mortar() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.098, 0.15, 22), CASE_STEP_MAT);
  body.position.y = 0.075; body.castShadow = body.receiveShadow = true;
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.062, 0.115, 22),
    new THREE.MeshStandardMaterial({ color: '#6f6a5e', roughness: 0.95 }));
  bowl.position.y = 0.100;
  const pestle = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.030, 0.30, 12), CASE_STEP_MAT);
  pestle.position.set(0.115, 0.145, 0.030); pestle.rotation.z = 0.42; pestle.castShadow = true;
  g.add(body, bowl, pestle);
  const rnd = mulberry32(41);
  for (let i = 0; i < 5; i++) {                          // 臼里没捣完的矿石
    const r = 0.016 + rnd() * 0.012;
    const o = new THREE.Mesh(roughRock(r, 700 + i * 13, 0.40, 0),
      specimenMat(COLOR_BY_ID[STONE_CIDS[i % 4]].hex, 700 + i * 13, false));
    const a = rnd() * Math.PI * 2, rr = rnd() * 0.045;
    o.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr);
    seatOnY0(o, 0.152);
    o.castShadow = true;
    g.add(o);
  }
  return g;
}
/* ② 陶盆 + 水 + 研石：水飞漂洗（同色系粗陶，不用彩釉） */
function washBasin() {
  const g = new THREE.Group();
  const CLAY = new THREE.MeshStandardMaterial({ color: '#8a7963', roughness: 0.9 });
  const basin = new THREE.Mesh(new THREE.CylinderGeometry(0.165, 0.132, 0.075, 26, 1, false), CLAY);
  basin.position.y = 0.038; basin.castShadow = basin.receiveShadow = true;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.165, 0.012, 8, 26), CLAY);
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.075;
  /* 「水」用一块深色哑光面片示意 —— 不用透明/发光，避免看起来像特效 */
  const water = new THREE.Mesh(new THREE.CircleGeometry(0.150, 26),
    new THREE.MeshStandardMaterial({ color: '#4a5760', roughness: 0.24 }));
  water.rotation.x = -Math.PI / 2; water.position.y = 0.068;
  const stone = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.058, 0.030, 16), CASE_STEP_MAT);
  stone.position.set(0.030, 0.083, -0.020); stone.rotation.z = 0.08;
  stone.castShadow = true;
  g.add(basin, rim, water, stone);
  return g;
}
/* ③ 三只玻璃小缸：同一色相的头青 / 二青 / 三青 —— 把「沉淀分级」讲明白 */
function settleJars(hex) {
  const g = new THREE.Group();
  const LEVELS = [['头青', 0.00], ['二青', 0.30], ['三青', 0.58]];
  LEVELS.forEach(([name, k], i) => {
    const x = (i - 1) * 0.115;
    const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.050, 0.050, 0.150, 20, 1, true), CASE_GLASS);
    jar.position.set(x, 0.075, 0);
    const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.050, 20), CASE_GLASS);
    bottom.rotation.x = Math.PI / 2; bottom.position.set(x, 0.001, 0);
    /* 缸里沉积的颜料：越往下层越浅（漂得越久越淡） */
    const sed = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.046, 0.042, 20),
      new THREE.MeshStandardMaterial({ color: tint(hex, k), roughness: 0.88 }));
    sed.position.set(x, 0.021, 0);
    const wa = new THREE.Mesh(new THREE.CylinderGeometry(0.047, 0.047, 0.088, 20),
      new THREE.MeshStandardMaterial({ color: '#46525a', roughness: 0.3, transparent: true, opacity: 0.5 }));
    wa.position.set(x, 0.086, 0);
    const nm = new THREE.Mesh(new THREE.PlaneGeometry(0.048, 0.014),
      new THREE.MeshStandardMaterial({ map: canvasTex(240, 70, (ctx, W, H) => {
        ctx.fillStyle = '#f3ecdd'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#2f2a1e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `40px ${CJK}`; ctx.fillText(name, W / 2, H / 2 + 2);
      }), roughness: 0.85 }));
    nm.rotation.x = -1.25; nm.position.set(x, 0.005, 0.062);
    g.add(jar, bottom, sed, wa, nm);
  });
  return g;
}
/* ④ 竹匾 + 8 色色粉小堆：全厅八色的收束点 */
function bambooTray() {
  const g = new THREE.Group();
  const BAMBOO = new THREE.MeshStandardMaterial({ color: '#b99a63', roughness: 0.86 });
  const tray = new THREE.Mesh(new THREE.CylinderGeometry(0.175, 0.168, 0.022, 28, 1, false), BAMBOO);
  tray.position.y = 0.011; tray.castShadow = tray.receiveShadow = true;
  const lip = new THREE.Mesh(new THREE.TorusGeometry(0.175, 0.013, 8, 28), BAMBOO);
  lip.rotation.x = Math.PI / 2; lip.position.y = 0.022;
  g.add(tray, lip);
  MINERALS.forEach((m, i) => {                            // 8 色，绕匾一圈
    const a = (i / MINERALS.length) * Math.PI * 2 + 0.35;
    const r = 0.105;
    const c = COLOR_BY_ID[m.cid];
    const p = pigmentMound(0.032, specimenMat(c.hex, 900 + i * 17, false));
    p.position.set(Math.cos(a) * r, 0.022, Math.sin(a) * r);
    p.castShadow = true;
    g.add(p);
  });
  return g;
}
/* 一座工序台：木台 + 台面 + 道具 + 平铺小铭牌（props 由调用方给，便于四台共用） */
function processBench(no, title, sub, props) {
  const g = new THREE.Group();
  const kick = new THREE.Mesh(new THREE.BoxGeometry(BENCH_W - 0.06, 0.06, BENCH_W - 0.06), WOOD_MAT);
  kick.position.y = 0.03; kick.castShadow = kick.receiveShadow = true; g.add(kick);
  const body = new THREE.Mesh(new THREE.BoxGeometry(BENCH_W, BENCH_H - 0.09, BENCH_W), CASE_BODY_MAT);
  body.position.y = (BENCH_H - 0.09) / 2 + 0.06; body.castShadow = body.receiveShadow = true; g.add(body);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(BENCH_W + 0.03, 0.03, BENCH_W + 0.03), CASE_FELT_MAT);
  deck.position.y = BENCH_H - 0.015; deck.castShadow = deck.receiveShadow = true; g.add(deck);
  props.position.set(0, BENCH_H, 0);
  const lab = benchLabel(no, title, sub);
  lab.position.y = BENCH_H;                              // 铭牌平铺在台面前缘
  g.add(props, lab);
  /* ⚠️ 这里**不加灯**：本厅已有 10 盏平柜射灯 + 2 盏洗墙灯 + buildRoom 的室内主灯，
     three.js 前向渲染没有光照剔除，再加 4 盏是全场景成本（见 HANDOFF §7.8 灯光预算）。 */
  return g;
}

/* ---------- 7. 工艺展板：从石头到颜色，六道工序 ---------- */
function processTex() {
  const STEPS = [
    ['采矿', '山中采出矿石原块'],
    ['选料', '剔除杂质，按色分堆'],
    ['粉碎', '捣成粗砂，石臼碾细'],
    ['水飞', '水中研磨漂洗去土'],
    ['分级', '沉淀分层，头青二青三青'],
    ['成粉', '晾干收贮，调胶上绢']
  ];
  return canvasTex(1400, 800, (ctx, W, H) => {
    ctx.fillStyle = '#efe6d2'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(90,75,45,0.45)'; ctx.lineWidth = 4; ctx.strokeRect(16, 16, W - 32, H - 32);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#2f2a1e'; ctx.font = `bold 62px ${CJK}`;
    ctx.fillText('从石头到颜色', W / 2, 108);
    ctx.fillStyle = '#7d6f52'; ctx.font = '26px ui-monospace,Consolas,monospace';
    ctx.fillText('FROM ORE TO PIGMENT', W / 2, 152);
    ctx.strokeStyle = 'rgba(90,75,45,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(80, 190); ctx.lineTo(W - 80, 190); ctx.stroke();
    const cw = 300, ch = 190, gx = 60, gy = 40;
    const x0 = (W - (cw * 3 + gx * 2)) / 2, y0 = 262;
    STEPS.forEach(([t, d], i) => {
      const r = Math.floor(i / 3), c = i % 3;
      const x = x0 + c * (cw + gx), y = y0 + r * (ch + gy);
      ctx.fillStyle = '#f6f0e2'; ctx.fillRect(x, y, cw, ch);
      ctx.strokeStyle = 'rgba(90,75,45,0.45)'; ctx.lineWidth = 3; ctx.strokeRect(x, y, cw, ch);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#a89468'; ctx.font = '22px ui-monospace,Consolas,monospace';
      ctx.fillText('STEP ' + (i + 1), x + 22, y + 46);
      ctx.fillStyle = '#2f2a1e'; ctx.font = `bold 52px ${CJK}`;
      ctx.fillText(t, x + 22, y + 118);
      ctx.fillStyle = '#6d6148'; ctx.font = `24px ${CJK}`;
      ctx.fillText(d, x + 22, y + 162);
      ctx.strokeStyle = 'rgba(90,75,45,0.55)'; ctx.fillStyle = 'rgba(90,75,45,0.55)';
      ctx.lineWidth = 3;
      if (c < 2) {                                     // 横向箭头
        const ax = x + cw + 10, ay = y + ch / 2;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + gx - 26, ay); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ax + gx - 14, ay);
        ctx.lineTo(ax + gx - 26, ay - 9); ctx.lineTo(ax + gx - 26, ay + 9);
        ctx.closePath(); ctx.fill();
      } else if (r === 0) {                            // 折返箭头
        ctx.beginPath();
        ctx.moveTo(x + cw / 2, y + ch + 6); ctx.lineTo(x + cw / 2, y + ch + gy - 14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + cw / 2, y + ch + gy - 2);
        ctx.lineTo(x + cw / 2 - 9, y + ch + gy - 14); ctx.lineTo(x + cw / 2 + 9, y + ch + gy - 14);
        ctx.closePath(); ctx.fill();
      }
    });
  });
}

/* ---------- 8. 原料墙（西墙）：进门正对的焦点 ----------
   分两段，各 12 件，中间一块铜隔板断开：
     北半「石色 · 矿石」  —— 紧邻北墙的粉碎/水飞工序，原料与工序相邻
     南半「水色 · 草木」  —— 紧邻南墙西端的水色成品柜
   ⚠️ 矿石是位移过的几何体（包围盒不再是 ±r），用 seatOnY0 落位；
      植物干料构造器自己已归零到 y=0，直接摆。 */
function buildSpecimenWall() {
  const g = new THREE.Group();
  const zc = 21.0, len = 7.0, topY = 1.20;
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.055, len), CASE_STEP_MAT);
  shelf.position.set(-18.72, topY - 0.0275, zc);
  shelf.castShadow = shelf.receiveShadow = true;
  g.add(shelf);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.040, len), CASE_FRAME_MAT);
  lip.position.set(-18.583, topY + 0.014, zc);
  g.add(lip);
  [18.6, 20.2, 21.8, 23.4].forEach(z => {
    const br = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.028, 0.05), CASE_FRAME_MAT);
    br.position.set(-18.74, topY - 0.068, z); br.castShadow = true;
    g.add(br);
  });
  /* 中间铜隔板：把两段分开 */
  const div = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.075, 0.016), CASE_FRAME_MAT);
  div.position.set(-18.72, topY + 0.0375, zc - 0.005);
  div.castShadow = true;
  g.add(div);

  /* 一段 12 件：z0 起、共 2.5m，颜色在自己那一类里循环（4 色 × 3 件）。
     big=false 的植物干料用小一号，免得贴到邻件。 */
  const runSection = (cids, kind, z0) => {
    for (let i = 0; i < 12; i++) {
      const c = COLOR_BY_ID[cids[i % cids.length]];
      const min = MINERAL_BY_CID[c.id];
      const stone = kind === 'stone';
      const seed = 500 + (stone ? 0 : 300) + i * 29;
      const rp = mulberry32(seed)();
      const r = stone ? 0.038 + rp * 0.022 : 0.038 + rp * 0.014;
      const x = -18.78, z = z0 + i * (2.5 / 11);
      const pad = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.35, r * 1.35, 0.006, 20), ACRYLIC_MAT);
      pad.position.set(x, topY + 0.003, z);
      g.add(pad);
      let it;
      if (stone) {
        it = new THREE.Mesh(roughRock(r, seed, 0.34, 1), specimenMat(c.hex, seed, false));
        it.position.set(x, 0, z);
        seatOnY0(it, topY + 0.006);                    // 坐在亚克力小垫上（垫高 6mm）
      } else {
        it = { bud:    () => budCluster(r, seed, driedMat('bud', seed)),
               fruit:  () => fruitPods(r, seed, driedMat('fruit', seed)),
               chip:   () => woodChips(r, seed, driedMat('chip', seed)),
               bundle: () => bundle(r, seed, driedMat('bundle', seed)) }[min.form]();
        it.position.set(x, topY + 0.006, z);
      }
      it.castShadow = true;
      g.add(it);
      /* 窄条小签：本色块 + 原料名，平贴在展品前面 */
      const tex = canvasTex(340, 54, (ctx, W, H) => {
        ctx.fillStyle = '#f3ecdd'; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(92,78,50,0.45)'; ctx.lineWidth = 2; ctx.strokeRect(3, 3, W - 6, H - 6);
        ctx.fillStyle = c.hex; ctx.fillRect(12, 11, 32, 32);
        ctx.strokeStyle = 'rgba(60,50,32,0.45)'; ctx.lineWidth = 1; ctx.strokeRect(12, 11, 32, 32);
        ctx.fillStyle = '#2f2a1e'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        ctx.font = `26px ${CJK}`; ctx.fillText(min.mat, 56, 40);
      });
      const tag = new THREE.Mesh(new THREE.PlaneGeometry(0.135, 0.0214),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }));
      tag.rotation.set(-Math.PI / 2 + 0.16, 0, Math.PI / 2);   // 平放、长边顺着墙
      tag.position.set(-18.625, topY + 0.005, z);
      g.add(tag);
    }
  };
  runSection(STONE_CIDS, 'stone', 18.0);                 // 北半
  runSection(PLANT_CIDS, 'plant', 21.5);                 // 南半

  /* 两段的标题铜牌（比层板高一截，落在展品头顶之上） */
  plate(textBoardTex({ w: 900, h: 240, bg:'#2a241b', fg:'#e8cf94',
    title:'石色 · 矿石研磨', sub:'MINERAL PIGMENT', titleSize:52, align:'center' }),
    1.46, 0.39, -18.86, 1.62, 19.25, Math.PI / 2);
  plate(textBoardTex({ w: 900, h: 240, bg:'#2a241b', fg:'#e8cf94',
    title:'水色 · 草木浸出', sub:'PLANT DYE', titleSize:52, align:'center' }),

/* 平面导览图 —— 序厅这块**落地双面牌**：正面朝大门(+Z)、背面朝主厅(−Z)。
   ── 为什么做成双面 ───────────────────────────────────────────────
   · 观众从大门（z=26）进来时看正面；从主厅方向（z=14）折返时看背面。序厅是唯一同时望得见
     来路与去路的厅，这块平面图正是「先平面定位」的那张，两面都得能用。
   · plate() 造的是 PlaneGeometry + MeshBasicMaterial，材质默认 **FrontSide —— 只画正面**，
     所以背面不是「同一块板翻过去」，而是**另立一片**同样的贴图、绕 Y 转 π（第 7 个参 Math.PI）。
   · 背面的 rotY=π **不镜像**：绕 Y 转 180° 把纹理本地 +x 映到世界 −x，而站在北侧看的观众
     屏幕右向也正好是世界 −x，两者相消 —— 背面看到的是不镜像的正图（已渲染核对）。
   · 两片在 z 上各退 0.01（合计错开 0.02）防共面闪烁。
   ⚠️ 原来的「实心背板 + 两条腿」撑法**必须换掉** —— 背板是一整块 Box，会把背面画面整个盖住；

   ⚠️ 立位**保持原位不动**（与第一单元同侧、序厅西半边，进门即可看到）：板心 (−4.2, 1.55, 22.72)。
   ⚠️ 板宽高比必须与画布严格相等（760:700）—— 由 G_PH 从 G_PW 派生保证，改宽就得同步改 canvas 像素。
   ⚠️ 它立在序厅中央偏西、四周没有要看的画心，所以**不受**内厅那 8 块展牌「板顶必须低于视高」
      的约束；那条约束是给「站在画前别挡住身后画作」的展牌用的，别套到这里。
   ⚠️ `plate()` 的参数序是 `(tex, pw, ph, x, y, z, rotY = 0, rotX = 0)`，**别错位** —— 这里曾经
      误写成 `-4.2, 22.6, 0`（于是 y=22.6 吊到天花板之上、z=0 落进八角主厅正中心），序厅里
      根本看不到这块牌子。 */

const G_X = -4.2, G_Z = 22.72, G_Y = 1.55;            // 牌心 —— 原位不动

const guideTex = canvasTex(760, 700, (ctx, W, H) => {

});

/* —— 木架：两根立柱分列牌宽**之外** + 顶部细横梁 + 前后两条落地横脚 + 柱脚短靴。

  const rail = new THREE.Mesh(new THREE.BoxGeometry(G_BEAM, 0.10, 0.12), WOOD_MAT);

[-1, 1].forEach(s => {                                // 每根柱脚的短靴：跨接前后两脚
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.12, 0.46), WOOD_MAT);

/* 剖面游览图 —— 把甬道与五个厅按参观动线「展开」成一条水平剖面长卷，补上序厅缺的那块展牌。
   （与序厅「平面导览图」互为配套：一张平面、一张剖面。）
   ── 为什么挂在序厅北墙的西段 ──────────────────────────────────────
   · 序厅北墙（z=14）就是通往八角主厅的那面墙 —— 观众从大门进来，迎面看到的正是它；把「全程
     预告」放在即将穿过的门洞旁边，读序也顺（先在平面导览牌上定好位，再在这块牌上看剖面动线）。
   · 板心 (−4.60, 1.70, 14.15)，rotY 缺省 0 → 法线 +Z，面朝厅内（朝南），正对从大门进来的观众。
   ── 为什么只能取 3.40m 宽、板心必须压到 −4.60 ──────────────────────
   北墙西段能挂板的**干净面只剩 x ∈ [−6.39, −2.79]**（3.60m），两头各被一样东西占住：
     · 东头：主厅门洞 |x| < 1.4，再被门套外扩到 ±1.9；
     · 再往东：八边形斜墙从 x = −2.79 起把墙面往南推（见下方八边形那条 ⚠️）。
   于是牌取 3.40m、板心压到 −4.60 → 板占 x ∈ [−6.30, −2.90]，两边各留 0.09 富余。
   ⚠️ 板面 1760×600（宽高比 2.93333），改展牌宽高就得同步改 canvas 像素，否则图被拉变形。
     现取 3.40 × 1.159（高 ≈ 3.40×600/1760）。
   ⚠️ **贴面间隙统一 0.04**（与 u1/u2/u3/u4 四条标题带、内厅八块展牌同规格）：北墙内表面在
      z = 14 + WALL_T/2 = 14.11，板落 z = 14.15 —— 这 0.04 是「牌面贴到既有墙面」时留的缝，别改。
      上面「干净面 x ∈ [−6.39, −2.79]」这个结论将来若要再往北墙挂东西，得先照这个数核一遍。
   ⚠️ 板贴墙、人站不到跟前，**不需要 blocker**：序厅 WALK 是 z ≥ 15.2，已经把人隔在 1.05m 外。
   ⚠️ `plate()` 的参数序是 `(tex, pw, ph, x, y, z, rotY = 0, rotX = 0)`，**别错位** ——
      序厅「平面导览图」那块曾经把 (x,y,z) 写成 (x,z,y)，板子被吊到天花板之上 / 落进别厅。
   ⚠️ **八边形捅进序厅 / 内厅**（第 26 轮发现的老问题，不是本次引入的，改前请先掂量）：
      `COLORS.forEach` 里八边形墙板的宽取的是 `2·MUSE_R·tan(π/8)` = 11.598，而真八边形棱长是
      `2·MUSE_R·sin(π/8)` = 10.715。宽出来的 0.88m 是**故意的** —— 用 tan 才能让相邻墙板
      在八个角上严丝合缝、不留 V 形缝。代价是：**这套墙实际是个外接圆半径 15.15 的八边形，
      不是 14**。它的南北两顶点落在 (0, ±15.15)，而序厅北墙、内厅南墙都建在 z = ∓14 ——
      于是两条斜墙**各捅进序厅和内厅 1.05m**，在门洞两侧各露出一片斜着的绿墙。
      门套 x ∈ [−1.9, 1.9] 只盖住中间一段，捅出来的部分比它宽 0.9m，盖不住。
      西侧那条斜墙的侵入区是 x ∈ [−2.79, 0]，正好是本板东端的边界 —— 板只取 3.40m 就是为了停在
      它西边。本处**不动**八边形本身：改它要连带动 `WALK` 的 `{circle:12.6}`、`STAND_R`、
      两个门套和 `roof8`，风险远大于收益。
      实测：站在序厅 (−4.15, 1.70, 19.5) 朝北，斜墙在屏幕右侧 12°~25° 处显形。 */
const sectionTex = canvasTex(1760, 600, (ctx, W, H) => {
  /* ==================== 剖面游览图 · SECTION 动线图 ====================
     1760×600（展牌 3.40m 宽 × 1.159m 高，贴在序厅北墙西段，1px ≈ 1.93mm；改展牌尺寸时这两句同步）。把单层馆的六个单元沿参观
     动线「展开」成一条剖面长卷：地面线贯穿全图，每个厅 = 地面线 + 左右墙 + 天花，
     厅间留缝，金色虚线沿地面串联、箭头示前进方向。
     全部确定性绘制（无 Math.random，伪随机用固定数组 / Math.sin）。 */
  const INK = '#3a3323', INK2 = '#7c735c', GOLD = '#b6873a',
        PAPER = '#efe6d2', FRAME = 'rgba(90,75,45,0.5)';
  /* 馆内八色（与 index.html 的 COLORS 同值），用于标本墙 / 色卡墙 */
  const SW = ['#3C4654', '#D6ECF0', '#BCE672', '#1E3C72',
              '#E4C6D0', '#A29B7C', '#425066', '#FFA631'];

  /* 剖面几何：地平线 GY，墙顶(天花) WT，高 GH；八角顶脊 RIDGE */
  const GY = 428, WT = 214, GH = GY - WT, RIDGE = 138, WT_T = 7;

  const txt = (s, x, y, font, color, align) => {
    ctx.font = font; ctx.fillStyle = color;
    ctx.textAlign = align || 'center'; ctx.fillText(s, x, y); ctx.textAlign = 'left';
  };
  const arrow = (x, y, s) => {                       // 右向箭头（带纸色底托，不与虚线糊在一起）
    ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(x, y, s * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - s, y - s * 0.66); ctx.lineTo(x + s * 1.05, y);
    ctx.lineTo(x - s, y + s * 0.66); ctx.closePath();
    ctx.fillStyle = GOLD; ctx.fill();
  };
  const swatches = (x, y, w, h, n) => {              // 一排色块（标本墙 / 色卡墙）
    const gap = 3, bw = (w - gap * (n - 1)) / n;
    for (let i = 0; i < n; i++) {
      const bx = x + i * (bw + gap);
      ctx.fillStyle = SW[i % SW.length]; ctx.fillRect(bx, y, bw, h);
      ctx.strokeStyle = 'rgba(40,32,20,0.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(bx, y, bw, h);
    }
  };

  /* ---------- 纸底 + 双线外框 ---------- */
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = FRAME; ctx.lineWidth = 5; ctx.strokeRect(15, 15, W - 30, H - 30);
  ctx.strokeStyle = 'rgba(90,75,45,0.22)'; ctx.lineWidth = 1.4; ctx.strokeRect(25, 25, W - 50, H - 50);

  /* ---------- 版头 ---------- */
  ctx.textBaseline = 'alphabetic';
  txt('剖面游览图', 50, 76, `bold 46px ${CJK}`, INK, 'left');
  ctx.fillStyle = GOLD; ctx.fillRect(52, 88, 122, 4);       // 标题下金色短饰线
  txt('SECTION · 参观动线', 322, 74, `21px ${CJK}`, INK2, 'left');
  txt('金色虚线 = 参观动线　→', W - 52, 70, `20px ${CJK}`, INK2, 'right');
  txt('各厅剖面墙高 4.6m（等比）', W - 52, 96, `20px ${CJK}`, INK2, 'right');
  ctx.strokeStyle = 'rgba(90,75,45,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(40, 112); ctx.lineTo(W - 40, 112); ctx.stroke();

/* ================= 辅助展板（内厅西墙）· 古色之用 =================
   板面 2.4×1.71 m，画布 1200×855（1200:855 = 2.4:1.71，比例锁死才不会把字拉变形）。

   ⚠️ 正文 25px / 行高 45 / 则间 19 这三个数是按「五则共 10 行、底部留白 34px」选定的；
      改文案字数（尤其第二则最长）要回头重算，否则落款会顶出外框。

plate(canvasTex(1200, 855, (ctx, W, H) => {
  const BG = '#efe6d2', INK = '#2f2a1e', ACCENT = '#8a6a2f';
  /* 行首禁则：中文标点（，。、；：！？）】》」』〉”’%）不得落在行首 ——
     wrapCJK 是纯贪心断行、不管这个，所以把上一行末字拉下来陪标点（两行总字数不变）。 */
  const NO_HEAD = '，。、；：！？）】》」』〉”’%';
  const fixHead = ls => {
    for (let i = 1; i < ls.length; i++)
      if (NO_HEAD.includes(ls[i][0]) && ls[i - 1].length > 1) {
        ls[i] = ls[i - 1].slice(-1) + ls[i]; ls[i - 1] = ls[i - 1].slice(0, -1);
      }
    return ls;
  };

  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(90,75,45,0.45)'; ctx.lineWidth = 4;
  ctx.strokeRect(16, 16, W - 32, H - 32);          // 外框内沿 y≈18 / y≈837

  const x0 = 56, maxW = W - 112;                   // 左边距与 textBoardTex 一致；正文最大行宽 1088px

  ctx.globalAlpha = 0.7; ctx.fillText('从《月曼清游图》十二开看设色之美', x0, 124); ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(90,75,45,0.35)'; ctx.lineWidth = 3;

  const bodySize = 25, lh = 45, gap = 19;
  const secs = [
    { h: '一　随类赋彩　', b: '「六法」之一。中国画不摹物象的固有色，而依物之「类」定色：宫瓦用石青，远山用黛蓝，仕女内衬用月白。取的是概念之色，故历久而不失其雅。' },
    { h: '二　石色与水色　', b: '矿物色（石青、石绿、赭石）厚重不透明，须先以淡墨或水色打底、再逐层薄罩；植物色（花青、藤黄）清透易渗，多用于罩染以调冷暖。本馆第一单元即按这两条工序线陈列。' },
    { h: '三　墨分五色　', b: '张彦远《历代名画记》谓「运墨而五色具」：焦、浓、重、淡、清。墨本身即是一色，与彩色相济而不相碍。' },
    { h: '四　色随月变　', b: '正月梅、二月柳、六月荷、九月菊、十二月雪：同一座宫苑，十二个月各有其色。此册逐月设色，本身就是一部按月编排的色谱。' },
    { h: '五　雅称即审美　', b: '「月白」取月华之轻，「霁蓝」取雨霁初晴，「松花」取松树花粉，「藕合」取藕心之色。古人以自然物象名色：名之成，即美之成。' },
  ];
  let y = 194, lastBaseline = y;
  secs.forEach((s, i) => {
    /* 按粗体度量换行（最宽情形），正文用常规体画就一定不会溢出 */
    ctx.font = `bold ${bodySize}px ${CJK}`;
    const lines = fixHead(wrapCJK(ctx, s.h + s.b, maxW));
    let idx = 0;                                    // 已排走的字数，用来定位每行里属于小标题的那几个字
    lines.forEach(ln => {
      const headEnd = Math.min(s.h.length, idx + ln.length);
      const headPart = idx < headEnd ? s.h.slice(idx, headEnd) : '';
      const bodyPart = ln.slice(headPart.length);
      let x = x0;
      if (headPart) { ctx.font = `bold ${bodySize}px ${CJK}`; ctx.fillStyle = ACCENT; ctx.fillText(headPart, x, y); x += ctx.measureText(headPart).width; }
      if (bodyPart) { ctx.font = `${bodySize}px ${CJK}`; ctx.fillStyle = INK; ctx.fillText(bodyPart, x, y); }
      idx += ln.length; lastBaseline = y; y += lh;
    });
    if (i < secs.length - 1) y += gap;
  });

  /* —— 落款：分隔线之下三行，小一档字号 —— */
  const footSepY = lastBaseline + 30;
  ctx.strokeStyle = 'rgba(90,75,45,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0, footSepY); ctx.lineTo(W - x0, footSepY); ctx.stroke();
  ctx.font = `24px ${CJK}`; ctx.fillStyle = INK; ctx.globalAlpha = 0.85;
  let fy = footSepY + 30;
  ['主展墙画心即此册十二开：上排正月—六月，下排七月—十二月，自左至右。',
   '清 · 陈枚　绢本设色　乾隆三年（1738）',
   '每开纵 37、横 31.8 厘米　故宫博物院藏'].forEach(t => { ctx.fillText(t, x0, fy); fy += 34; });
  ctx.globalAlpha = 1;
}), 2.4, 1.71, -6.2, 1.275, -20, Math.PI/2);

const paintWallImg = new Image();

function drawPaintWall() {

}

function proximity() {
  let best = -1, bd = 3.6;
  exhibits.forEach((e, i) => {
    const dx = camera.position.x - e.x, dz = camera.position.z - e.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if (d < bd) { bd = d; best = i; }
  });
  if (best < 0) {                  // 展台优先；都不在范围内才看画作
    const dx = camera.position.x - PAINT_POS.x, dz = camera.position.z - PAINT_POS.z;
    if (dx*dx + dz*dz < PAINT_POS.r * PAINT_POS.r) best = PAINT_IDX;
  }
  if (best !== currentIdx) {
    currentIdx = best;
    if (best === PAINT_IDX) {
      showInfo(best);
      museumDotEls.forEach(d => d.classList.remove('on'));
    } else if (best >= 0) {
      showInfo(best);
      museumDotEls.forEach((d, k) => d.classList.toggle('on', k === best));
    } else {
      info.classList.remove('show');
    }
  }
}

/* ---------- 自由视角点击拾取 ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hoverKey = '';
let lockedClickAt = 0;      // 漫游中处理过一次左键的时间戳，用来拦住随后那次 canvas click

function pickAt(clientX, clientY) {
  pointer.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(hitboxes, false)[0];
  return hit ? hit.object.userData : null;
}

function setHover(hd) {
  const key = hd ? hd.kind + ':' + (hd.idx !== undefined ? hd.idx : (hd.id || '')) : '';
  if (key === hoverKey) return;
  hoverKey = key;
  canvas.style.cursor = hd ? 'pointer' : 'default';
  const si = (hd && hd.kind === 'stand') ? hd.idx : -1;
  exhibits.forEach((e, k) => { e.pickRing.visible = (k === si); });
}

/* ---------- 「左键点下去会怎样」的提示 ----------
   漫游（指针锁定）时钉在屏幕中心当准星，靠近展品就提示展卷；自由视角下贴着光标走。
   两种状态都能一眼看出下一步点哪，不用再记「要先按 ESC」。 */
const aimEl = document.getElementById('aim');
const aimTipEl = document.getElementById('aim-tip');
const AIM_STAND = '点击鼠标左键 · 进入卷轴';
const AIM_PAINT = '点击鼠标左键 · 放大观画';
const AIM_BLANK = '点击空地 · 退出漫游';
let aimKey = '';

function setAim(text, x, y) {
  const locked = controls.isLocked;
  const key = text ? (locked ? '锁|' : '游|') + text : '';
  if (key !== aimKey) {
    aimKey = key;
    aimEl.classList.toggle('free', !!text && !locked);
    aimEl.classList.toggle('dim', text === AIM_BLANK);
    if (text) aimTipEl.textContent = text;
    aimEl.classList.toggle('on', !!text);
  }
  if (!aimKey) return;
  if (locked) { aimEl.style.left = ''; aimEl.style.top = ''; }   // 居中当准星
  else { aimEl.style.left = x + 'px'; aimEl.style.top = y + 'px'; }   // 追着光标
}

/* 同一个提示，锁定时说「点击鼠标左键 · X」，自由视角下说「点击X」 */
function aimTextFor(hd, locked) {
  if (!hd) return locked ? AIM_BLANK : '';
  return (locked ? '点击鼠标左键 · ' : '点击') + (hd.kind === 'stand' ? '进入卷轴' : '放大观画');
}

canvas.addEventListener('pointermove', (e) => {
  /* 指针锁定时 clientX/clientY 会冻结，射线无意义 —— 先行短路 */
  if (controls.isLocked) { setHover(null); return; }
  const hd = pickAt(e.clientX, e.clientY);
  setHover(hd);
  setAim(aimTextFor(hd, false), e.clientX, e.clientY);
});
canvas.addEventListener('pointerleave', () => {
  if (controls.isLocked) return;
  setHover(null);
  setAim('');
});

/* 「点展品 = 看文物/看画，点空地 = 进漫游」 */
canvas.addEventListener('click', (e) => {
  /* 这一次点击若刚被下面那条 mousedown 处理过（退锁是异步的，click 到达时
     isLocked 可能还是 true），就不要再当成「点空地进漫游」而立刻重新锁定 */
  if (e.timeStamp - lockedClickAt < 400) return;
  if (currentView !== 'museum' || controls.isLocked) return;
  const hd = pickAt(e.clientX, e.clientY);
  setHover(null);
  setAim('');
  if (hd && hd.kind === 'stand') { openScroll(hd.idx); return; }
  if (hd && hd.kind === 'paint') { openPainting(); return; }
  if (hd && hd.kind === 'plate') { openPainting(hd.id); return; }
  controls.lock();
});

/* 漫游中的左键。用 mousedown：指针锁定时鼠标事件都派发给 body，canvas 收不到。
     靠近展品 → 直接展卷 / 观画（左键即进，不必先按 ESC 解锁）
     否则     → 退出漫游，把光标还给参观者 */
document.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (currentView !== 'museum' || !controls.isLocked) return;
  lockedClickAt = e.timeStamp;
  if (currentIdx === PAINT_IDX) { openPainting(); return; }
  if (currentIdx >= 0) { openScroll(currentIdx); return; }
  controls.unlock();
});

/* ---------- 3D 主循环 ---------- */
const clock = new THREE.Clock();
function animate() {
  /* 注意：不要在里面再调 requestAnimationFrame，
     setAnimationLoop 自己会调度；两者并存会出现两条 rAF 链 → 双倍渲染和移速 */
  const dt = Math.min(clock.getDelta(), 0.1);

  if (controls.isLocked) {
    const speed = 5.0;
    const p = controls.getObject().position;
    const ox = p.x, oz = p.z;
    controls.moveForward(dir.f * speed * dt);
    controls.moveRight(dir.s * speed * dt);

    /* 圆形障碍推开（展台 / 展柜 / 家具） */
    for (const b of blockers) {
      const dx = p.x - b.x, dz = p.z - b.z;
      const d = Math.sqrt(dx*dx + dz*dz);
      if (d < b.r && d > 0.0001) { p.x = b.x + dx/d*b.r; p.z = b.z + dz/d*b.r; }
    }
    /* 可行走区域（展厅并集）；越界则沿墙滑动，必要时原地停住 */
    if (!walkable(p.x, p.z)) {
      if (walkable(p.x, oz)) p.z = oz;
      else if (walkable(ox, p.z)) p.x = ox;
      else { p.x = ox; p.z = oz; }
    }
    p.y = 1.7;
    proximity();
    /* 漫游中每帧更新准星提示：对着展台/画作就提示左键展卷/观画 */
    setAim(currentIdx === PAINT_IDX ? AIM_PAINT
         : currentIdx >= 0       ? AIM_STAND
         :                         AIM_BLANK);
  }

  renderer.render(scene, camera);
}

/* 卷轴结构：引首(0) + 8 色段(1..8) + 拖尾(9)，故色段 i 的下标是 i+1 */
const total = COLORS.length + 2;
let cur = 0;

/* ⚠️ .scroll 上有 scroll-behavior:smooth，直接赋值 scrollLeft 会被它接管而变成动画。
   这里临时改成 auto，保证「瞬时定位」，否则会和 scroll-snap 打架。 */
function setScrollLeft(v) {
  const prev = scrollTrack.style.scrollBehavior;
  scrollTrack.style.scrollBehavior = 'auto';
  scrollTrack.scrollLeft = v;
  scrollTrack.style.scrollBehavior = prev;
}

function go(idx) {
  idx = Math.max(0, Math.min(total - 1, idx));
  cur = idx;
  setScrollLeft(idx * scrollTrack.clientWidth);
}

document.getElementById('prev').addEventListener('click', () => go(cur - 1));
document.getElementById('next').addEventListener('click', () => go(cur + 1));

scrollTrack.addEventListener('scroll', () => {
  const w = scrollTrack.clientWidth;
  if (!w) return;
  const i = Math.round(scrollTrack.scrollLeft / w);
  cur = i;
  scrollDotEls.forEach((d, k) => d.classList.toggle('on', k === i - 1));
  document.getElementById('pfill').style.width = ((i / (total - 1)) * 100) + '%';
});

document.addEventListener('keydown', (e) => {
  if (currentView !== 'scroll') return;
  if (e.key === 'ArrowRight') go(cur + 1);

});

let revealPlayed = false;

function openScroll(i) {
  if (currentView === 'scroll') { go(i + 1); return; }
  currentView = 'scroll';

  /* 首次进入播完整的揭幕+铺开动效；之后进入只做短淡入。
     .settled 必须"先加、后取消 hidden"，否则会闪一帧重播的动画。 */
  if (revealPlayed) {
    scrollViewEl.classList.add('settled');
    scrollViewEl.classList.remove('fade');
    void scrollViewEl.offsetWidth;
    scrollViewEl.classList.add('fade');
  } else {
    scrollViewEl.classList.remove('settled');
  }
  revealPlayed = true;

  if (controls.isLocked) controls.unlock();
  setHover(null);
  museumEl.classList.add('hidden');
  paintViewEl.classList.add('hidden');
  scrollViewEl.classList.remove('hidden');

  /* ⚠️ 必须在取消 hidden 之后再定位：容器 display:none 时 clientWidth 为 0，
     scrollLeft 会静默失败，卷轴将停在引首段。 */
  go(i + 1);

  renderer.setAnimationLoop(null);   // 隐藏期间停掉 3D 渲染
}

function backToMuseum() {
  currentView = 'museum';
  scrollViewEl.classList.add('hidden');
  paintViewEl.classList.add('hidden');
  museumEl.classList.remove('hidden');
  clock.getDelta();                  // 丢弃暂停期间累积的时间
  renderer.setAnimationLoop(animate);
}

  renderer.setAnimationLoop(null);
}

function closePainting() {
  if (currentView !== 'painting') return;
  currentView = 'museum';
  paintViewEl.classList.add('hidden');
  museumEl.classList.remove('hidden');
  clock.getDelta();
  renderer.setAnimationLoop(animate);
}

paintImg.addEventListener('load',  () => { if (currentView === 'painting') syncPaintFrame(); });
paintImg.addEventListener('error', () => { if (currentView === 'painting') syncPaintFrame(); });
renderGuide();
syncPaintFrame();

/* ============================================================
   5. 配乐（文件缺失时按钮自动置灰，不影响其它功能）
   ============================================================ */
const paEl   = document.getElementById('paint-audio');
const paNote = document.getElementById('paint-audio-note');
paEl.src = ASSETS.painting.audio;
paEl.addEventListener('error', () => {
  paEl.style.display = 'none';
  paNote.style.display = 'block';
});

const bgmEl  = document.getElementById('bgm');
const bgmBtn = document.getElementById('bgm-btn');
let bgmReady = false, bgmOn = false;

function setBgm(on) {
  bgmOn = on;
  bgmBtn.classList.toggle('on', on);
  if (on) bgmEl.play().catch(() => {}); else bgmEl.pause();
}
bgmEl.src = ASSETS.bgm;
bgmBtn.classList.add('off');
bgmEl.addEventListener('canplaythrough', () => {
  bgmReady = true;
  bgmBtn.classList.remove('off');
  bgmBtn.title = '馆内环境配乐';
});
bgmEl.addEventListener('error', () => {
  bgmReady = false; bgmOn = false;
  bgmBtn.classList.remove('on');
  bgmBtn.classList.add('off');
  bgmBtn.title = '配乐待置入：' + ASSETS.bgm;
});
bgmBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!bgmReady) return;
  setBgm(!bgmOn);
});
/* 浏览器要求用户手势后才能播放：首次点击时若配乐就绪就自动起播 */
let bgmAuto = false;
addEventListener('pointerdown', (e) => {
  if (bgmAuto || !bgmReady || bgmOn) return;
  if (e.target && e.target.closest && e.target.closest('#bgm-btn')) return;
  bgmAuto = true;
  setBgm(true);
});

/* ---------- 启动 ---------- */
renderer.setAnimationLoop(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
